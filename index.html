#hUp{left:9px;top:196px}#hDn{left:9px;top:372px}

#advbtns{position:absolute;left:79px;top:196px;width:64px;height:192px}

.infobox{position:absolute;left:5px;top:389px;width:192px;height:183px;background:var(--tx-marble) #4a2416;border:2px solid #b08a3a;box-shadow:inset 0 0 0 1px #000;padding:6px 7px;font-size:12.5px;overflow:hidden;cursor:pointer}

 background:var(--tx-marble) #4a2416;border:3px solid #b08a3a;box-shadow:inset 0 0 0 2px #000,0 0 0 2px #000,0 12px 40px rgba(0,0,0,.8);padding:14px 16px 12px;font-size:15.5px;line-height:1.38;animation:mIn 180ms var(--ease)}

function addCre(arr,k,n){const s=arr.find(x=>x&&x.id===k);if(s){s.n+=n;return true;}const i=arr.indexOf(null);if(i<0)return false;arr[i]={id:k,n};return true;}
function takeCre(arr,k,n){let left=n;for(let i=0;i<arr.length&&left>0;i++){const s=arr[i];if(s&&s.id===k){const t=Math.min(left,s.n);s.n-=t;left-=t;if(!s.n)arr[i]=null;}}return n-left;}
function removeCre(p,k,n){let left=n;for(const arr of armies(p)){if(left<=0)break;left-=takeCre(arr,k,left);}return n-left;}
const armyCount=arr=>arr.reduce((a,s)=>a+(s?1:0),0);
function writeOff(p,sec,q){const L=p.lots[sec]||[];let left=q,cost=0;for(const l of L){if(left<=0)break;const t=Math.min(left,l.q);l.q-=t;left-=t;cost+=t*l.pr;}p.lots[sec]=L.filter(l=>l.q>0);if(!p.lots[sec].length)delete p.lots[sec];return cost;}
const nearCastle=(p,h)=>{const c=castleOf(p);return c&&Math.max(Math.abs(c.x-h.x),Math.abs(c.y-h.y))<=1;};

function classValues(p){
  const v={cash:Math.max(0,p.cash),bank:p.sav+p.deps.reduce((a,d)=>a+d.amt,0),gov:0,corp:0,stock:0,fund:0,realty:0,gold:0};
  for(const id in p.lots){const q=qty(p,id);if(q>0)v[SECM[id].cls]+=q*price(id);}
  for(const f of p.flats)v.realty+=Math.max(0,flatValue(f)-(f.mort?f.mort.bal:0));
  return v;}
function nwOf(p){const v=classValues(p);let s=0;for(const k in v)s+=v[k];return s-p.card-p.margin;}
function investOf(p){const v=classValues(p);return v.bank+v.gov+v.corp+v.stock+v.fund+v.realty+v.gold-p.margin;}
function riskyVal(p){const v=classValues(p);return v.gov+v.corp+v.stock+v.fund+v.gold;}
const cushion=p=>(Math.max(0,p.cash)+p.sav)/p.exp;
function freeRatio(p){const mi=minesOf(p).reduce((a,o)=>a+mineInc(p,o),0);return (Math.max(0,investOf(p))*0.04/12+mi)/p.exp;}

function makePlayer(i,c){const f=FAC[c.fac].s;
  const p={id:i,name:c.name||('Игрок '+(i+1)),fac:c.fac,col:FAC[c.fac].col,cash:f.cash,kn:f.kn,calm:f.calm,conn:f.conn,sal:f.sal,exp:f.exp,
    b:Object.fromEntries(f.b.map(x=>[x,1])),bw:-1,heroes:[makeHero(c.fac,0,true)],hi:0,gar:Array(7).fill(null),avail:{},
    lots:{},deps:[],sav:0,flats:[],card:0,margin:0,iis:{open:-1,contrib:{},ref:0},depInt:0,pm:0,paid:false,inc:[],nw:[],rep:[],L:{},newL:[],
    vis:{},auto:{w:0,inst:'sav',pct:50},out:false,jobless:0,free:false,ex:[],stats:{b:0,win:0,lost:0}};

  for(const b in DWELL)if(p.b[b])for(const k of DWELL[b])p.avail[k]=CRE[k].g;

function newGame(cfg){
  G={v:VERSION,turn:0,max:cfg.years*48,years:cfg.years,mode:cfg.mode,cur:0,key:14,infl:7.5,cpi:1,cpiY0:1,lastYI:7.5,reg:'norm',ridx:1,maxKeyYear:14,
    m:{},players:[],log:[],ev:WEEK_EVENTS[0],next:null,rumor:null,reps:null,shock:0,pyr:{alive:true,name:PYR_NAMES[0],inv:{},col:0,re:0},over:false,winner:null};
  for(const s of SEC){const st={p:s.p||1000,h:[],ch:0,def:false};if(s.kind==='bond'){st.y=s.yf(G.key,G.infl,G.reg);st.p=bondFair(s,st.y);}st.h=[+st.p.toFixed(2)];G.m[s.id]=st;}
  cfg.players.forEach((c,i)=>G.players.push(makePlayer(i,c)));
  genMap();G.next=drawEvent();
  G.players.forEach(p=>{p.nw.push([Math.round(nwOf(p)),1]);rep(p,'🎺 Начинается ваш путь к финансовой свободе!');lesson(p,'army');p.newL=p.newL.filter(x=>x!=='army');});
  G.log.unshift({t:0,x:'Игра началась.'});}
function drawEvent(){if(Math.random()<0.22){const k=pick(CREK.filter(k=>CRE[k].t<=5));return {id:'cw',cre:k,w:0,icon:'⭐',name:`Неделя: ${CRE[k].n}`,text:`Прирост «${CRE[k].np}» +5 во всех замках.`};}return wpick(WEEK_EVENTS);}
function guardFor(mt,z){const d=NEU[mt],pw=[0,420,1900,6200,26000][z];return {mt,n:Math.max(1,Math.round(pw/(d.hp*(d.mn+d.mx)/2)*rnd(.8,1.2))),z};}

/* ---- map generation ---- */
function genMap(){
  const n=G.players.length,W=n>2?26:22,H_=W,t=new Array(W*H_).fill(0),idx=(x,y)=>y*W+x;
  for(let b=0;b<Math.floor(W*H_/17);b++){let x=ri(0,W-1),y=ri(0,H_-1);const ty=pick([1,1,1,2,2,3]);const sz=ri(3,9);for(let k=0;k<sz;k++){if(x>=0&&y>=0&&x<W&&y<H_)t[idx(x,y)]=ty;x+=ri(-1,1);y+=ri(-1,1);}}
  const corners=[[2,2],[W-3,H_-3],[W-3,2],[2,H_-3]].slice(0,n);const obj=[];let oid=1;const occ=new Set();
  const clr=(cx,cy,r)=>{for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)if(x>=0&&y>=0&&x<W&&y<H_)t[idx(x,y)]=0;};
  const mx=W>>1,my=H_>>1;clr(mx,my,1);
  corners.forEach(([cx,cy])=>{let x=cx,y=cy;while(x!==mx||y!==my){if(x!==mx&&(Math.random()<0.5||y===my))x+=Math.sign(mx-x);else y+=Math.sign(my-y);t[idx(x,y)]=4;}});
  G.players.forEach((p,i)=>{const [cx,cy]=corners[i];clr(cx,cy,2);obj.push({id:oid++,t:'castle',x:cx,y:cy,pid:i});occ.add(idx(cx,cy));const h=p.heroes[0];
    h.x=cx+(cx<W/2?1:-1);h.y=cy+(cy<H_/2?1:-1);occ.add(idx(h.x,h.y));});
  const zoneAt=(x,y)=>{const d=Math.min(...corners.map(([cx,cy])=>Math.abs(cx-x)+Math.abs(cy-y)));return d<7?1:d<13?2:3;};
  const free=(near)=>{for(let k=0;k<800;k++){let x,y;if(near){x=near[0]+ri(-2,2);y=near[1]+ri(-2,2);}else{x=ri(1,W-2);y=ri(1,H_-2);}
      if(x<1||y<1||x>W-2||y>H_-2)continue;const i=idx(x,y);if(t[i]===1||t[i]===2||t[i]===3||occ.has(i))continue;
      if(obj.some(o=>Math.abs(o.x-x)<=1&&Math.abs(o.y-y)<=1))continue;if(!near&&corners.some(([cx,cy])=>Math.abs(cx-x)+Math.abs(cy-y)<3))continue;occ.add(i);return [x,y];}return null;};
  const mts=Object.keys(NEU);
  const add=(o,gch,near,minZ)=>{const pos=free(near);if(!pos)return null;o.id=oid++;o.x=pos[0];o.y=pos[1];if(gch&&Math.random()<gch)o.g=guardFor(pick(mts.filter(m=>m!=='infl'||zoneAt(o.x,o.y)>=3)),Math.max(minZ||1,zoneAt(o.x,o.y)));obj.push(o);return o;};
  const f=W*H_/484;
  occ.add(idx(mx,my));obj.push({id:oid++,t:'treas',x:mx,y:my,g:guardFor('infl',4)});
  G.players.forEach((p,i)=>{if(p.fac==='stronghold'){const m=MINES[0];add({t:'mine',n:m.n,i:m.i,inc:m.inc,owner:i},0,corners[i]);}});
  const mines=[...MINES].sort(()=>Math.random()-0.5);
  for(let k=0;k<4+2*n;k++){const m=mines[k%mines.length];add({t:'mine',n:m.n,i:m.i,inc:m.inc,owner:-1},0.85);}
  for(let k=0;k<Math.round(9*f);k++)add({t:'chest',amt:ri(6,16)*1000},0.4);
  for(let k=0;k<5;k++)add({t:'shop',item:ri(0,SHOP.length-1)},0);
  for(let k=0;k<3;k++)add({t:'lib'},0.3);
  for(let k=0;k<3;k++)add({t:'well'},0);
  const sks=Object.keys(SK).sort(()=>Math.random()-0.5);for(let k=0;k<4;k++)add({t:'sage',sk:sks[k]},0.5);
  for(let k=0;k<Math.round(12*f);k++){const r=pick(['kn','kn','conn','cash']);add({t:'pile',res:r,amt:r==='kn'?ri(1,3):r==='conn'?1:ri(3,8)*1000},0.2);}
  const arts=Object.keys(ARTS).filter(a=>a!=='crown').sort(()=>Math.random()-0.5);for(let k=0;k<4;k++)add({t:'art',a:arts[k]},1,null,2);
  for(let k=0;k<Math.round(8*f);k++)add({t:'mon'},1);
  const py=free([mx+3,my-3])||free();if(py)obj.push({id:oid++,t:'pyr',x:py[0],y:py[1]});
  const pass=i=>t[i]===0||t[i]===4;
  const reach=()=>{const seen=new Uint8Array(W*H_);const [sx,sy]=corners[0];const q=[idx(sx,sy)];seen[q[0]]=1;while(q.length){const c=q.pop(),x=c%W,y=(c/W)|0;for(const [dx,dy] of DIR4){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H_)continue;const ni=idx(nx,ny);if(!seen[ni]&&pass(ni)){seen[ni]=1;q.push(ni);}}}return seen;};
  let seen=reach();const [tx,ty]=corners[0];
  const pts=obj.map(o=>[o.x,o.y]).concat(G.players.map(p=>[p.heroes[0].x,p.heroes[0].y]));
  for(const [ox,oy] of pts){if(seen[idx(ox,oy)])continue;let x=ox,y=oy,g=0;while(!seen[idx(x,y)]&&g++<200){if(t[idx(x,y)]!==4)t[idx(x,y)]=0;if(x!==tx&&(Math.random()<0.5||y===ty))x+=Math.sign(tx-x);else y+=Math.sign(ty-y);}seen=reach();}
  G.map={W,H:H_,t,obj,oid};
  G.players.forEach((p,i)=>{p.ex=new Array(W*H_).fill(0);reveal(p,corners[i][0],corners[i][1],5);reveal(p,p.heroes[0].x,p.heroes[0].y,4);});}
function reveal(p,x,y,r){const {W,H}=G.map;for(let yy=Math.max(0,y-r);yy<=Math.min(H-1,y+r);yy++)for(let xx=Math.max(0,x-r);xx<=Math.min(W-1,x+r);xx++)if((xx-x)**2+(yy-y)**2<=r*r+1)p.ex[yy*W+xx]=1;}
const objAt=(x,y)=>G.map.obj.find(o=>o.x===x&&o.y===y);
const castleOf=p=>G.map.obj.find(o=>o.t==='castle'&&o.pid===p.id);
function removeObj(o){G.map.obj=G.map.obj.filter(x=>x!==o);}
const heroAt=(x,y)=>{for(const q of G.players)if(alive(q))for(const h of q.heroes)if(h.x===x&&h.y===y)return [q,h];return null;};
function freeNear(cx,cy){const {W,H,t}=G.map;for(let r=1;r<4;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const x=cx+dx,y=cy+dy;if(x<0||y<0||x>=W||y>=H)continue;const tt=t[y*W+x];if((tt===0||tt===4)&&!objAt(x,y)&&!heroAt(x,y))return [x,y];}return [cx,cy+1];}

function processWeek(){
  G.turn++;const t=G.turn,w=wk(t),m=mo(t),y=yr(t);const P=G.players.filter(alive);
  const pre=new Map(P.map(p=>[p,riskyVal(p)]));

function growth(p,ev){const L=[];for(const b in DWELL)if(p.b[b])for(const k of DWELL[b]){const g=Math.round(CRE[k].g*(p.b.guild?1.5:1))+(ev.cre===k?5:0);p.avail[k]=Math.min((p.avail[k]||0)+g,g*4);L.push(`${CRE[k].np} +${g}`);}
  if(L.length)rep(p,`🏰 Прирост в жилищах: ${L.join(', ')}`);}
function regimeStep(){const tr={norm:[['boom',0.07],['crisis',0.035]],boom:[['norm',0.14],['crisis',0.07]],crisis:[['norm',0.22],['boom',0.04]]};
  let r=Math.random(),nr=G.reg;for(const [k,pr] of tr[G.reg]){if(r<pr){nr=k;break;}r-=pr;}if(nr===G.reg)return;G.reg=nr;
  if(nr==='crisis'){G.shock=-0.11;news('🌩️ Месяц Кризиса! Рынки обвалились, армии подешевели.');allLesson('crisis');}
  else if(nr==='boom'){G.shock=0.04;news('🚀 Месяц Ралли! Экономика на подъёме.');allLesson('rally');}else news('🙂 Экономика вернулась в норму.');}
function marketStep(ev){const R=REG[G.reg],sq=Math.sqrt(52);const mret=R.dr/52+R.vol*gauss()/sq+(ev.mk||0)+(G.shock||0);G.shock=0;
  const old={};for(const s of SEC)old[s.id]=G.m[s.id].p;const rum=G.rumor&&G.rumor.t<G.turn?G.rumor:null;
  for(const s of SEC){const st=G.m[s.id];

    else if(s.kind==='fund')st.p*=1+mret+0.065/52-s.fee/52+0.004*gauss();

  const L=G.m.ofzL,A=G.m.corpA,bf=G.m.fBond;bf.p*=1+0.5*(L.p/old.ofzL-1)+0.5*(A.p/old.corpA-1)+((SECM.ofzL.c+SECM.corpA.c)/2/100)/52-SECM.fBond.fee/52;
  for(const s of SEC){const st=G.m[s.id];st.ch=st.p/old[s.id]-1;st.h.push(+st.p.toFixed(2));if(st.h.length>160)st.h.shift();}
  if(rum){const s=SECM[rum.id];news(rum.good?`🗣️ Слух подтвердился: ${s.name} +12%. Повезло — на этот раз.`:`🗣️ Слух оказался пустышкой: ${s.name} −8%. Купившие на слухах в минусе.`);allLesson('rumor');G.rumor=null;}
  if(wk(G.turn)===1)G.ridx*=1+G.infl/1200+R.re+0.004*gauss();}

function payouts(w,m){const P=G.players.filter(alive);
  for(const s of SEC){const st=G.m[s.id],k=SEC2CRE[s.id];

function defaults(){for(const s of SEC.filter(s=>s.hz)){const st=G.m[s.id],k=SEC2CRE[s.id];

      for(const p of G.players.filter(alive))if(qty(p,s.id)>0){lesson(p,'default');p.calm-=Math.round(10*calmLoss(p));}}}}
function cbMeeting(){const target=G.infl+3+0.5*(G.infl-4),d=target-G.key;let step=0;
  if(Math.abs(d)>=0.75){step=clamp(Math.round(d*0.6*2)/2,-2,2);if(step===0)step=d>0?0.5:-0.5;}
  const old=G.key;G.key=clamp(+(G.key+step).toFixed(2),4,25);G.maxKeyYear=Math.max(G.maxKeyYear,G.key);step=G.key-old;
  if(step>0)news(`🏛️ ЦБ повысил ключевую ставку до ${fr(G.key)} (было ${fr(old)}). Облигации дешевеют, новые вклады выгоднее.`);
  else if(step<0)news(`🏛️ ЦБ снизил ставку до ${fr(G.key)} (было ${fr(old)}). Длинные ОФЗ дорожают, новые вклады станут скромнее.`);
  else news(`🏛️ ЦБ сохранил ставку ${fr(G.key)}.`);
  if(step)G.players.filter(alive).forEach(p=>{lesson(p,'rate');if(step<0&&p.deps.length)lesson(p,'depfix');});}
function flows(p,ev,t,w,m,y){const se=salaryEff(p);p.cash-=p.exp/4;

  else{if(w===2){p.cash+=se*0.4;rep(p,`💰 Аванс: +${fm(se*0.4)}`);}if(w===4){p.cash+=se*0.6;rep(p,`💰 Зарплата: +${fm(se*0.6)}`);}}
  rep(p,`🧺 Расходы недели: −${fm(p.exp/4)}`);

      const g=flatValue(f)*0.055/12*(p.fac==='dungeon'?1.1:1)*(hasArt(p,'crown')?1.15:1),net=g*0.85*0.87;p.cash+=net;p.pm+=net;p.paid=true;rep(p,`🗿 Аренда «${FLATM[f.id].name}»: +${fm(net)} (после расходов и налога)`);lesson(p,'rent');}
    if(m===1&&t>=48){const raise=Math.max(0,G.lastYI*rnd(0.7,1.15)+2*sk(p,'diplomacy')+0.3*Math.min(p.conn,10));p.sal*=1+raise/100;rep(p,`📈 Индексация зарплаты: ${fp(raise)} (инфляция за год ${fr(G.lastYI)})`);lesson(p,'salary');}
    if(Math.random()<0.3)lifeEvent(p);}
  if(m===4&&w===2&&p.iis.open>=0){const c=p.iis.contrib[y-1]||0;if(c>0){const r=Math.min(c,400000)*0.13;p.cash+=r;p.iis.ref+=r;rep(p,`🧾 Налоговый вычет по ИИС за прошлый год: +${fm(r)}`);}}
  p.deps=p.deps.filter(d=>{if(t>=d.e){p.cash+=d.amt;rep(p,`🏦 Вклад на ${d.term} мес. завершён: ${fm(d.amt)} вернулись на счёт.`);return false;}return true;});

function lifeEvent(p){const lk=1+0.2*sk(p,'luck');const L=LIFE.map(e=>({...e,w:e.good?e.w*lk:e.w}));const e=wpick(L);let a=e.f(p);const cm=cushion(p);

function pyramidStep(t){const P=G.pyr;

    if(t>=P.col){for(const id of ids){const p=G.players[id];rep(p,`💥 Пирамида «${P.name}» рухнула. Ваши ${fm(P.inv[id])} пропали.`);lesson(p,'pyramid');p.calm-=Math.round(15*calmLoss(p));}

function monthEnd(P,m){const R=REG[G.reg];G.infl=clamp(G.infl+0.2*(R.inf-G.infl)-0.12*(G.key-G.infl-3)+0.5*gauss(),1,25);G.cpi*=1+G.infl/1200;

    if(it>0){p.depInt+=it;p.pm+=it;rep(p,`🏦 Проценты по счёту и вкладам: +${fm(it)}`);lesson(p,'compound');}
    for(const o of minesOf(p)){if(Math.random()<0.1){rep(p,`${o.i} «${o.n}»: плохой месяц, прибыли нет.`);continue;}const v=mineInc(p,o);p.cash+=v;p.pm+=v;rep(p,`${o.i} «${o.n}»: +${fm(v)}`);}

    if(freeRatio(p)>=1&&!p.free){p.free=true;news(`🗝️ ${p.name} достиг финансовой свободы!`);if(G.mode==='race'&&G.winner==null){G.winner=p.id;G.over=true;}}
    if(m===12){const nt=1e6*G.maxKeyYear/100,tax=Math.max(0,p.depInt-nt)*0.13;if(tax>0){p.cash-=tax;rep(p,`🧾 Налог на проценты по вкладам за год: −${fm(tax)}`);lesson(p,'deptax');}p.depInt=0;}}}
function calmUpdate(p){const cm=cushion(p);if(cm>=3)p.calm+=p.b.wall?3:1;else if(cm<1)p.calm-=1;if(p.card>0)p.calm-=1;

function marginCheck(p){if(p.margin<=0)return;const v=classValues(p);

    const pay=Math.min(p.cash,p.margin);p.cash-=pay;p.margin-=pay;p.calm-=Math.round(15*calmLoss(p));
    rep(p,`⚠️ Маржин-колл! Брокер распустил ваши акции и фонды на ${fm(got)} и забрал ${fm(pay)} в счёт долга.`);lesson(p,'margin');}}

function buySec(p,id,q,iis){const s=SECM[id],pr=price(id);if(q<=0)return false;
  let unit=pr*(1+feeOf(p));if(p.fac==='necro'&&G.reg==='crisis'&&(s.cls==='stock'||s.cls==='fund'))unit*=0.9;
  const cost=unit*q;if(cost>p.cash+0.01)return false;p.cash-=cost;(p.lots[id]||(p.lots[id]=[])).push({q,pr:unit,w:G.turn,iis:!!iis});
  if(iis){if(p.iis.open<0){p.iis.open=G.turn;p.iis.contrib={};}const y=yr(G.turn);p.iis.contrib[y]=(p.iis.contrib[y]||0)+cost;lesson(p,'iis');}
  if(s.cls==='fund')lesson(p,'fund');if(s.cls==='gold')lesson(p,'gold');return true;}
function sellPreview(p,id,q){const pr=price(id)*(1-feeOf(p));let left=q,gain=0,iisBreak=false;
  for(const l of (p.lots[id]||[])){if(left<=0)break;const k=Math.min(left,l.q);left-=k;const g=(pr-l.pr)*k;if(l.iis){if(G.turn-p.iis.open<240){iisBreak=true;gain+=g;}}else if(G.turn-l.w<144)gain+=g;}
  const tax=Math.max(0,gain)*0.13;return {gross:pr*q,tax,net:pr*q-tax,iisBreak};}
function sellSec(p,id,q,silent){q=Math.min(q,qty(p,id));if(q<=0)return {net:0,tax:0};const r=sellPreview(p,id,q);let left=q;
  for(const l of p.lots[id]){if(left<=0)break;const k=Math.min(left,l.q);l.q-=k;left-=k;}p.lots[id]=p.lots[id].filter(l=>l.q>0);if(!p.lots[id].length)delete p.lots[id];
  p.cash+=r.net;if(r.tax>0&&!silent)lesson(p,'ldv');
  if(r.iisBreak){p.cash-=p.iis.ref;rep(p,`🧾 ИИС закрыт досрочно: возвращено государству ${fm(p.iis.ref)} вычетов.`);p.iis={open:-1,contrib:{},ref:0};for(const k in p.lots)p.lots[k].forEach(l=>l.iis=false);lesson(p,'iis');}

/* ---- hex geometry: flat-top, odd columns shifted down (Wesnoth) ---- */
const hcx=c=>c*54+36,hcy=(c,r)=>r*72+(c&1)*36+36;
function hnb(c,r){return (c&1)?[[c,r-1],[c,r+1],[c-1,r],[c-1,r+1],[c+1,r],[c+1,r+1]]:[[c,r-1],[c,r+1],[c-1,r-1],[c-1,r],[c+1,r-1],[c+1,r]];}
function hdist(a,b,c,d){const z1=b-(a-(a&1))/2,z2=d-(c-(c&1))/2;const dx=a-c,dz=z1-z2;return Math.max(Math.abs(dx),Math.abs(dz),Math.abs(dx+dz));}
function pix2hex(px,py){const c0=Math.round((px-36)/54);let best=null,bd=1e9;for(let c=c0-1;c<=c0+1;c++){const r0=Math.round((py-36-(c&1)*36)/72);for(let r=r0-1;r<=r0+1;r++){const d=(hcx(c)-px)**2+(hcy(c,r)-py)**2;if(d<bd){bd=d;best=[c,r];}}}return best;}
/* engine overrides for hex topology */
function reveal(p,x,y,r){const {W,H}=G.map;for(let yy=Math.max(0,y-r-1);yy<=Math.min(H-1,y+r+1);yy++)for(let xx=Math.max(0,x-r);xx<=Math.min(W-1,x+r);xx++)if(hdist(x,y,xx,yy)<=r)p.ex[yy*W+xx]=1;}
const passT=tt=>tt===0||tt===4;
const walkObj=(p,o)=>o&&o.t==='gate'&&p.gates&&p.gates[o.id];
function stepCost(p,x,y){return typeof hexCost==='function'?hexCost(x,y,p):(G.map.t[y*G.map.W+x]===4?.7:1);}
function findPath(p,h,tx,ty){const {W,H,t}=G.map,S=h.y*W+h.x,T=ty*W+tx;if(S===T||!p.ex[T]||!passT(t[T]))return null;
  const block=new Uint8Array(W*H);for(const o of G.map.obj)if(!walkObj(p,o))block[o.y*W+o.x]=1;for(const q of G.players)if(alive(q))for(const hh of q.heroes)if(hh!==h)block[hh.y*W+hh.x]=2;
  if(block[T]===2){const q=heroAt(tx,ty);if(!q)return null;}const prev=new Int32Array(W*H).fill(-1),dist=new Float64Array(W*H).fill(1e9);prev[S]=S;dist[S]=0;const hp=[[0,S]];
  const push=e=>{hp.push(e);let k=hp.length-1;while(k){const pa=(k-1)>>1;if(hp[pa][0]<=hp[k][0])break;[hp[pa],hp[k]]=[hp[k],hp[pa]];k=pa;}};
  const pop=()=>{const top=hp[0],l=hp.pop();if(hp.length){hp[0]=l;let k=0;for(;;){const a=2*k+1,b=a+1;let m=k;if(a<hp.length&&hp[a][0]<hp[m][0])m=a;if(b<hp.length&&hp[b][0]<hp[m][0])m=b;if(m===k)break;[hp[m],hp[k]]=[hp[k],hp[m]];k=m;}}return top;};
  while(hp.length){const [d,cc]=pop();if(cc===T)break;if(d>dist[cc])continue;const x=cc%W,y=(cc/W)|0;
    for(const [nx,ny] of hnb(x,y)){if(nx<0||ny<0||nx>=W||ny>=H)continue;const ni=ny*W+nx;if(!p.ex[ni]||!passT(t[ni]))continue;if(block[ni]&&ni!==T)continue;
      const nd=d+stepCost(p,nx,ny)+(nx!==x&&ny!==y?1e-4:0);if(nd<dist[ni]){dist[ni]=nd;prev[ni]=cc;push([nd,ni]);}}}
  if(prev[T]===-1)return null;const path=[];let cc=T;while(cc!==S){path.push([cc%W,(cc/W)|0]);cc=prev[cc];}return path.reverse();}

    case 'mine':tt=`${o.n}`;d=`Бизнес: ~${fm(o.inc*G.cpi)} в месяц${p.fac==='stronghold'?' (+50% вам)':''}. ${o.owner<0?'Ничей.':o.owner===p.id?'Ваш.':'Принадлежит: '+esc(G.players[o.owner].name)+'. Можно перехватить.'}`;break;

    case 'shop':tt='Лавка соблазнов';d=`Внутри: ${SHOP[o.item].n}.`;break;
    case 'lib':tt='Библиотека';d='+2 Знания раз в месяц.';break;
    case 'well':tt='Колодец спокойствия';d='+20 Хладнокровия раз в неделю и полная мана.';break;
    case 'sage':tt='Хижина наставника';d=`Учит навыку «${SK[o.sk].n}».`;break;
    case 'pile':tt=o.res==='kn'?'Книги':o.res==='conn'?'Визитки':'Кошелёк';d=o.res==='cash'?fm(o.amt*G.cpi):`+${o.amt} ${o.res==='kn'?'Знания':'Связи'}`;break;
    case 'art':tt=ARTS[o.a].n;d=ARTS[o.a].d;break;
    case 'mon':tt=guardText(o.g);d=MON[o.g.mt].hint;break;
    case 'pyr':tt=`«${G.pyr.name}»`;d=G.pyr.alive?'«Инвестиционная компания»: обещают 10% в неделю.':'Руины. Говорят, скоро откроются снова под новым именем.';break;
    case 'treas':tt='Сокровищница Инфляции';d='Внутри — Корона Рантье и огромная казна.';break;}
  if(o.g&&o.t!=='mon')d+=` <span class="bad">Охрана: ${guardText(o.g)}.</span> <span class="mute">${MON[o.g.mt].hint}</span>`;

function visit(p,o){const h=H(p);
  if(o.g){if(!armyCount(h.army)){toast('Без армии герой не может сражаться. Наймите отряды в замке.');return;}startBattle(p,h,o);return;}
  const tw=G.turn;
  switch(o.t){
    case 'castle':if(o.pid===p.id){const nw=learnSpells(p,h);if(nw.length)toast(`Герой выучил: ${nw.map(s=>SPELLS[s].n).join(', ')}`);setTab('castle');}else toast('Чужой замок. Здесь копит капитал соперник.');break;
    case 'mine':if(o.owner===p.id){toast('Этот бизнес уже ваш.');break;}{const prev=o.owner;o.owner=p.id;reveal(p,o.x,o.y,3);lesson(p,'business');
      msg(o.n,`<p>${prev>=0?'Вы перехватили бизнес у соперника!':'Теперь это ваш бизнес.'} Доход около <b>${fm(mineInc(p,o))}</b> в конце каждого месяца, но бывают плохие месяцы.</p>`);}break;
    case 'chest':{const a=Math.round(o.amt*G.cpi*(1+G.turn/150)),xp=Math.round(a/40);removeObj(o);
      msg('Сундук',`<p>Внутри ${fm(a)}. Можно забрать деньги или потратить находку на курсы: +${xp} опыта герою и +1 Знание.</p>`,[{t:`Взять ${fk(a)}`,f:()=>{p.cash+=a;afterAction();}},{t:'Учиться',c:'pri',f:()=>{gainXP(p,h,xp);p.kn++;afterAction();}}]);}break;
    case 'shop':if(p.vis[o.id]===tw){toast('Вы уже заходили сюда на этой неделе.');break;}p.vis[o.id]=tw;temptation(p,SHOP[o.item]);break;
    case 'lib':if(p.vis[o.id]!=null&&Math.floor(p.vis[o.id]/4)===Math.floor(tw/4)){toast('В этом месяце вы уже прочли всё новое.');break;}p.vis[o.id]=tw;{const k=G.ev.books?4:2;p.kn+=k;msg('Библиотека',`<p>Вы изучили новые книги: +${k} Знания.</p>`);}break;
    case 'well':if(p.vis[o.id]===tw){toast('Колодец отдыхает до следующей недели.');break;}p.vis[o.id]=tw;p.calm=Math.min(calmMax(p),p.calm+20);h.mana=Math.max(h.mana,manaMax(h));toast('Хладнокровие +20, мана восстановлена');break;
    case 'sage':if(hsk(h,o.sk)){toast('Герой уже владеет этим навыком.');break;}if(Object.keys(h.sk).filter(k=>h.sk[k]).length>=8){toast('У героя уже 8 навыков.');break;}
      h.sk[o.sk]=1;msg('Наставник',`<p>${esc(h.nm)} освоил навык <b>${SK[o.sk].n}</b>: ${SK[o.sk].d(1)}.</p>`);break;
    case 'pile':removeObj(o);if(o.res==='kn')p.kn+=o.amt;else if(o.res==='conn')p.conn+=o.amt;else p.cash+=o.amt*G.cpi;toast(o.res==='cash'?`+${fm(o.amt*G.cpi)}`:`+${o.amt} ${o.res==='kn'?'Знания':'Связи'}`);break;
    case 'art':removeObj(o);h.arts.push(o.a);msg('Артефакт!',`<p><b>${ARTS[o.a].n}</b>: ${ARTS[o.a].d}.</p>`);break;
    case 'pyr':pyramidModal(p);break;}
  afterAction();}
function temptation(p,it){const sale=G.ev.sale,pr=Math.round(it.p*G.cpi*(sale?0.7:1));lesson(p,'temptation');
  msg(`${it.n}`,`<p>${sale?'<b class="gold">Чёрная пятница: −30%!</b> ':''}Цена: <b>${fm(pr)}</b>. Покупка поднимет настроение: +${it.c} Хладнокровия.</p><p class="mute small">Это ${(pr/p.exp*100).toFixed(0)}% ваших месячных расходов.</p>`,
   [{t:'Купить',dis:p.cash<pr,f:()=>{p.cash-=pr;p.calm=Math.min(calmMax(p),p.calm+it.c);afterAction();}},
    {t:'Отказаться',c:'pri',f:()=>{const d=2*sk(p,'discipline');if(d)p.calm+=d;else if(sale&&!hasArt(p,'amulet'))p.calm-=2;toast(d?`Дисциплина: +${d} Хладнокровия`:'Деньги остались в казне.');afterAction();}}]);}
function pyramidModal(p){const P=G.pyr;if(!P.alive){msg('Руины','<p>Офис пуст, на двери записка: «Технические работы».</p>');return;}

function bCost(p,b){const c={cash:Math.round(b.c.cash*G.cpi),kn:b.c.kn,conn:b.c.conn||0};if(p.fac==='citadel'&&b.id==='exchange')c.kn*=2;return c;}
const costStr=c=>[c.cash?fk(c.cash)+' ₽':'',c.kn?c.kn+' Зн.':'',c.conn?c.conn+' Св.':''].filter(Boolean).join(' · ')||'Бесплатно';
function dayAction(p,a){const h=H(p);if(h.ap<=0){toast('У героя закончились дни этой недели.');return;}const d=7-h.ap;
  if(a==='work'&&d>=5){toast('Переработка возможна только в будни.');return;}if(a==='rest'&&d<5){toast('Отдыхать можно в выходные.');return;}
  h.ap--;h.mp=0;
  if(a==='study'){p.kn++;gainXP(p,h,40);toast(`${DAYS[d]}: учёба, +1 Знание`);}
  if(a==='work'){const v=salaryEff(p)*0.04;p.cash+=v;if(!sk(p,'discipline'))p.calm=Math.max(0,p.calm-6);toast(`${DAYS[d]}: переработка, +${fm(v)}`);}
  if(a==='rest'){p.calm=Math.min(calmMax(p),p.calm+12);toast(`${DAYS[d]}: отдых, +12 Хладнокровия`);}
  afterAction();}
function slotHTML(s,i,where){if(!s)return `<button class="slot empty" data-w="${where}" data-i="${i}" aria-label="Пустой слот"></button>`;const C=CRE[s.id];

function moveStackUI(p,from,i){const h=H(p);const src=from==='g'?p.gar:h.army,dst=from==='g'?h.army:p.gar;const s=src[i];if(!s)return;

function recruitModal(p,k){const C=CRE[k],s=SECM[C.sec];openM((box,close)=>{const unit=C.lot*price(C.sec)*(1+feeOf(p))*(p.fac==='necro'&&G.reg==='crisis'&&(s.cls==='stock'||s.cls==='fund')?0.9:1);

function runAuto(p){p.auto.w--;const w=wk(G.turn);

  if(s.kind==='fund'||s.kind==='bfund')return `реинвестирует · комиссия ${fr(s.fee*100)} в год`;return 'без выплат';}
function upcoming(p,n){const out=[];for(let k=1;k<=n;k++){const t=G.turn+k,w=wk(t),m=mo(t),L=[];

  if(w===3&&CB_MONTHS.includes(m))L.push('заседание ЦБ');
  for(const s of SEC){if(s.kind==='bond'&&s.week===w&&s.months.includes(m)&&(s.freq<12||qty(p,s.id)))L.push(`купон ${secName(s.id)}${qty(p,s.id)?' ★':''}`);if(s.kind==='stock'&&w===2&&s.dm.includes(m))L.push(`дивиденд ${s.name}${qty(p,s.id)?' ★':''}`);}
  if(w===1&&[2,5,8,11].includes(m))L.push('квартальные отчёты');if(m===4&&w===2&&p.iis.open>=0)L.push('вычет по ИИС');p.deps.forEach(d=>{if(d.e===t)L.push('завершение вклада ★');});
  if(L.length)out.push(`<div><span class="mute num">${dateShort(t)}</span><span>${L.join(' · ')}</span></div>`);}return out.join('');}

  $('#v-hero').innerHTML=`${p.heroes.length>1?`<div class="seg" style="margin-bottom:12px">${p.heroes.map((x,i)=>`<button class="${i===p.hi?'on':''}" data-hh="${i}">${esc(x.nm)}</button>`).join('')}</div>`:''}

   <div class="prim">${PRIM.map(([k,n,ic])=>`<div>${ico(ic)}<span class="small mute">${n}</span><b>${h[k]}</b></div>`).join('')}</div>

   <div class="sec-h">Армия героя</div><div class="slots">${h.army.map((s,i)=>s?`<div class="slot" title="${CRE[s.id].n}"><img src="${creImg(s.id)}" alt="${CRE[s.id].n}"><b>${s.n}</b></div>`:'<div class="slot empty"></div>').join('')}</div>
   <p class="small mute">Стоимость армии: ${fm(h.army.reduce((a,s)=>a+(s?s.n*creUnit(s.id):0),0))}. Передавать войска можно в замке.</p>

   <div class="sec-h">Путь к свободе <span class="small mute">4% вложений в год + бизнесы против расходов</span></div><div class="bar" style="height:16px"><i style="width:${clamp(fr_*100,0,100)}%;background:linear-gradient(90deg,var(--gold-dim),var(--gold))"></i></div><div class="small" style="margin-top:4px">${Math.round(fr_*100)}% · ${p.free?'Свобода достигнута!':'цель — 100%'}</div>

function renderJournal(){const p=CP();const seg=`<div class="seg">${[['rank','Рейтинг'],['les','Уроки'],['log','События']].map(([k,t])=>`<button class="${ui.jt===k?'on':''}" data-j="${k}">${t}</button>`).join('')}</div>`;let h=seg;
  if(ui.jt==='rank'){const R=G.players.map(q=>({q,nw:nwOf(q),real:nwOf(q)/G.cpi})).sort((a,b)=>b.real-a.real);
    h+=`<div class="sec-h">Рейтинг <span class="small mute">${dateStr(G.turn)} · до финала ${G.max-G.turn} нед.</span></div><div class="tw"><table class="tbl"><tr><th>Игрок</th><th>Капитал</th><th>Реальный</th><th>Свобода</th><th>Уроки</th></tr>${R.map(({q,nw,real})=>`<tr><td>${esc(q.name)}${q.out?' (выбыл)':''}${q.free?' ★':''}</td><td class="num">${fk(nw)}</td><td class="num">${fk(real)}</td><td class="num">${Math.round(freeRatio(q)*100)}%</td><td class="num">${Object.keys(q.L).length}</td></tr>`).join('')}</table></div>
    <p class="small mute">«Реальный» капитал — в ценах начала игры: так видно, обогнали ли вы инфляцию (${fp((G.cpi-1)*100)} с начала). Потери в боях за игру: ${fm(p.stats.lost)}.</p>
    <div class="sec-h">Игра</div><div class="mbtns" style="justify-content:flex-start"><button class="btn" id="jnew">Новая игра</button></div><p class="small mute">Версия ${VERSION}. Сохранение после каждого хода в этом браузере.</p>`;}
  else if(ui.jt==='les'){const ks=Object.keys(LES);h+=`<div class="sec-h">Уроки таверны <span class="small mute">${Object.keys(p.L).length} из ${ks.length}</span></div><div style="display:grid;gap:8px">${ks.filter(k=>p.L[k]).map(lessonHTML).join('')}${ks.filter(k=>!p.L[k]).map(()=>'<div class="locked-box">Урок откроется, когда вы встретитесь с этим в игре.</div>').join('')}</div>`;}
  else h+=`<div class="sec-h">Летопись</div><div class="card replist" style="max-height:none">${G.log.slice(0,80).map(l=>`<div><span class="mute num small">${dateShort(l.t)}</span> ${l.x}</div>`).join('')}</div>`;
  const root=$('#v-journal');root.innerHTML=h;root.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{ui.jt=b.dataset.j;renderJournal();});
  const jn=root.querySelector('#jnew');if(jn)jn.onclick=()=>msg('Новая игра?','<p>Текущая партия будет удалена.</p>',[{t:'Отмена'},{t:'Начать заново',c:'red',f:()=>{clearSave();G=null;MQ.length=0;setTimeout(showStart,0);}}]);}

/* ================= TURN FLOW ================= */
function endTurn(){if(!G||G.over||ui.anim)return;const n=G.players.length;let guard=0;
  do{G.cur++;if(G.cur>=n){G.cur=0;processWeek();if(G.over){save();gameOver();return;}}}while(!alive(CP())&&guard++<10);
  const p=CP();for(const h of p.heroes){h.ap=7;h.mp=0;h.mana=Math.min(manaMax(h),h.mana+Math.ceil(manaMax(h)/3));if(nearCastle(p,h))learnSpells(p,h);}save();
  if(p.auto.w>0){runAuto(p);setTimeout(endTurn,20);return;}startTurnUI(p);}
function startTurnUI(p){ui.path=null;ui.target=null;ui.tab='map';$('#v-map').hidden=false;const h=H(p);centerOn(h.x,h.y);renderAll();
  if(G.players.filter(alive).length>1)openM((box,close)=>{$('#modal').classList.add('opaque');
    box.innerHTML=`<div class="hand" style="--pc:${p.col}"><div class="hi"><img class="cimg" src="${portrait(p)}" alt=""></div><div class="mute">Передайте устройство</div><h2>${esc(p.name)}</h2><div>${FAC[p.fac].n}</div><div class="date">${dateStr(G.turn)}</div><button class="btn pri big" id="hgo" style="margin-top:12px">Начать ход</button></div>`;
    box.querySelector('#hgo').onclick=close;});
  if(G.turn===0&&!p.L.fire){lesson(p,'fire');p.newL=p.newL.filter(x=>x!=='fire');openM((box,close)=>{box.innerHTML=`<h2>${esc(h.nm)}, ${FAC[p.fac].n}</h2><div class="mbody">${lessonHTML('fire')}${lessonHTML('army')}
    <p><b>Как играть.</b> Ход — неделя из 7 дней. На карте нажмите клетку и «Идти». В <b>Замке</b> стройте жилища и нанимайте существ: каждое существо — это пакет ценных бумаг, его цена меняется вместе с рынком. Передавайте войска герою, когда он стоит рядом с замком.</p>
    <p>Бой идёт на гексах, как в «Героях»: отряды ходят по скорости, стрелки стреляют, на удар отвечают. Нажмите на врага — увидите прогноз урона, нажмите ещё раз — атака.</p></div><div class="mbtns"><button class="btn pri" id="ok">В путь!</button></div>`;box.querySelector('#ok').onclick=close;});}
  else openM(reportFn(p));
  if(p.calm<25&&riskyVal(p)>0)openM((box,close)=>{lesson(p,'panic');box.innerHTML=`<h2>Паника подступает</h2><div class="mbody"><p>Хладнокровие ${p.calm}. Рука тянется распустить все рискованные отряды, «пока не стало хуже».</p>${lessonHTML('panic')}</div><div class="mbtns"><button class="btn red" id="pS">Распустить рискованные отряды</button><button class="btn pri" id="pH">Держаться (+5)</button></div>`;
    box.querySelector('#pS').onclick=()=>{panicSell(p,1);p.newL=p.newL.filter(x=>x!=='panic');close();afterAction();};box.querySelector('#pH').onclick=()=>{p.calm+=5;p.newL=p.newL.filter(x=>x!=='panic');close();afterAction();};});
  if(G.ev.sale&&G.turn>0)temptation(p,pick(SHOP));levelUp(p);showLessons(p);}
function reportFn(p){return (box,close)=>{const ev=G.ev,lines=p.rep.splice(0),last=p.nw.length>1?p.nw[p.nw.length-2][0]:null,nw=nwOf(p);
  let extra='';if(seesNext(p))extra+=`<p class="small">Следующая неделя: <b>${G.next.name}</b> — ${G.next.text}</p>`;else if(p.b.tavern){const e=Math.random()<0.6?G.next:pick(WEEK_EVENTS);extra+=`<p class="small">В таверне шепчут, что грядёт «${e.name}».</p>`;}
  if(seesReports(p)&&G.reps)extra+=`<p class="small">Отчёты на следующей неделе: ${Object.entries(G.reps).map(([id,s])=>`${SECM[id].name} ${s>=0?'↑':'↓'}`).join(', ')}</p>`;
  if(G.rumor&&G.rumor.t===G.turn)extra+=`<p class="small gold">Слух: «${SECM[G.rumor.id].name} взлетит на следующей неделе!»</p>`;
  box.innerHTML=`<h2>${dateStr(G.turn)}</h2><div class="mbody"><div class="evcard"><div class="ei">${ev.icon}</div><div><b>${ev.name}</b><div class="small">${ev.text}</div></div></div>${extra}
   <div class="kv"><div><div class="k">Капитал</div><div class="v">${fm(nw)}</div></div>${last!=null?`<div><div class="k">За неделю</div><div class="v ${nw-last>=0?'up':'dn'}">${nw-last>=0?'+':''}${fm(nw-last)}</div></div>`:''}<div><div class="k">Свободно</div><div class="v">${fm(p.cash)}</div></div></div>
   ${lines.length?`<div class="replist">${lines.slice(-60).map(l=>`<div>${l}</div>`).join('')}</div>`:''}</div><div class="mbtns"><button class="btn pri" id="rok">К делу</button></div>`;box.querySelector('#rok').onclick=close;};}
function gameOver(){renderAll();const R=G.players.map(q=>({q,real:nwOf(q)/G.cpi})).sort((a,b)=>b.real-a.real);const win=G.winner!=null?G.players[G.winner]:R[0].q;
  openM(box=>{$('#modal').classList.add('opaque');box.innerHTML=`<h2>Итоги</h2><div class="mbody"><div class="evcard"><div class="ei">${FAC[win.fac].i}</div><div><b>${esc(win.name)}</b><div class="small">${G.winner!=null?'первым достиг финансовой свободы!':'самый большой реальный капитал'}</div></div></div>
   <div class="tw"><table class="tbl"><tr><th>Игрок</th><th>Капитал</th><th>Реальный</th><th>Свобода</th><th>Уроки</th></tr>${R.map(({q,real})=>`<tr><td>${esc(q.name)}</td><td class="num">${fk(nwOf(q))}</td><td class="num">${fk(real)}</td><td class="num">${Math.round(freeRatio(q)*100)}%</td><td class="num">${Object.keys(q.L).length}</td></tr>`).join('')}</table></div>
   <p class="small mute">Инфляция за игру: ${fp((G.cpi-1)*100)}. Реальный капитал показан в ценах начала игры.</p></div><div class="mbtns"><button class="btn pri" id="gn">Новая игра</button></div>`;
   box.querySelector('#gn').onclick=()=>{clearSave();G=null;MQ.length=0;nextModal();showStart();};});}

function inPoly(x,y,pts){let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}

const PANC={};
function panData(fac){if(PANC[fac])return PANC[fac];const o=A.img['pan_'+fac],e=A.img['pane_'+fac],m=A.img['panm_'+fac];if(!o||!e||!m)return null;
  const get=im=>{const cv=document.createElement('canvas');cv.width=1600;cv.height=748;const c=cv.getContext('2d',{willReadFrequently:true});c.drawImage(im,0,0,1600,748);return c.getImageData(0,0,1600,748);};
  const comp=document.createElement('canvas');comp.width=1600;comp.height=748;return PANC[fac]={o:get(o),e:get(e),m:get(m).data,comp,sig:'',cut:{}};}
function panCompose(p){const D=panData(p.fac);if(!D)return null;const on=LBL.map(id=>hsBuilt(p,id)),sig=on.map(Number).join('');if(sig===D.sig)return D.comp;
  if(D.sig&&!RED()){const prev=document.createElement('canvas');prev.width=1600;prev.height=748;prev.getContext('2d').drawImage(D.comp,0,0);TW.fade={cv:prev,t0:performance.now()};}
  const out=new ImageData(1600,748),O=D.o.data,E=D.e.data,M=D.m,R=out.data;
  for(let i=0;i<R.length;i+=4){const lab=Math.round(M[i]/20)-1;const a=(lab>=0&&on[lab])?M[i+1]/255:0;
    if(a<=0){R[i]=E[i];R[i+1]=E[i+1];R[i+2]=E[i+2];}else if(a>=1){R[i]=O[i];R[i+1]=O[i+1];R[i+2]=O[i+2];}else{R[i]=E[i]+(O[i]-E[i])*a;R[i+1]=E[i+1]+(O[i+1]-E[i+1])*a;R[i+2]=E[i+2]+(O[i+2]-E[i+2])*a;}R[i+3]=255;}
  D.comp.getContext('2d').putImageData(out,0,0);D.sig=sig;return D.comp;}
function cutOf(fac,id){const D=panData(fac);if(!D)return null;if(D.cut[id]!==undefined)return D.cut[id];const k=LBL.indexOf(id)+1,M=D.m,O=D.o.data;let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(let y=0;y<748;y++)for(let x=0;x<1600;x++){const i=(y*1600+x)*4;if(Math.round(M[i]/20)===k&&M[i+1]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
  if(x1<0)return D.cut[id]=null;const w=x1-x0+1,h=y1-y0+1,cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d'),im=c.createImageData(w,h),d=im.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=((y+y0)*1600+x+x0)*4,j=(y*w+x)*4;if(Math.round(M[i]/20)===k){d[j]=O[i];d[j+1]=O[i+1];d[j+2]=O[i+2];d[j+3]=M[i+1];}}
  c.putImageData(im,0,0);const P=24,gl=document.createElement('canvas');gl.width=w+P*2;gl.height=h+P*2;const g=gl.getContext('2d');g.shadowColor='rgba(255,214,110,1)';g.shadowBlur=18;g.drawImage(cv,P,P);g.shadowBlur=8;g.drawImage(cv,P,P);g.globalCompositeOperation='destination-out';g.drawImage(cv,P,P);
  return D.cut[id]={cv,gl,x:x0,y:y0,w,h,P};}
const THC={};
function bldThumb(fac,lbl,W,H){const key=fac+lbl+W;if(THC[key])return THC[key];const cu=cutOf(fac,lbl);const cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,'#3a4a5a');g.addColorStop(1,'#2a2214');c.fillStyle=g;c.fillRect(0,0,cv.width,cv.height);
  const D=panData(fac);if(cu&&D){const k=Math.min(cv.width*.9/cu.w,cv.height*.9/cu.h,2.2);const rw=cv.width/k,rh=cv.height/k,rx=clamp(cu.x+cu.w/2-rw/2,0,1600-rw),ry=clamp(cu.y+cu.h/2-rh/2,0,748-rh);
    c.drawImage(A.img['pane_'+fac],rx,ry,rw,rh,0,0,cv.width,cv.height);c.fillStyle='rgba(0,0,0,.2)';c.fillRect(0,0,cv.width,cv.height);c.drawImage(cu.cv,(cu.x-rx)*k,(cu.y-ry)*k,cu.w*k,cu.h*k);}

function drawPan(now){const p=CP(),fac=p.fac;const cv=$('#pancv'),c=hiCanvas(cv,800,374);const comp=panCompose(p)||A.img['pan_'+fac];if(!comp){c.fillStyle='#222';c.fillRect(0,0,800,374);return;}
  c.drawImage(comp,0,0,800,374);
  if(TW.fade){const a=1-(now-TW.fade.t0)/1200;if(a<=0)TW.fade=null;else{c.save();c.globalAlpha=a;c.drawImage(TW.fade.cv,0,0,800,374);c.restore();}}
  const am=AMB[fac]||{},T=now/1000,red=RED();
  if(!red){
    if(am.clouds){c.save();const [y0,y1]=am.clouds;for(let k=0;k<5;k++){const x=((T*(6+k*2)+k*230)%1100)-150,y=y0+(y1-y0)*h32(k,3,1);const g=c.createRadialGradient(x,y,4,x,y,70);g.addColorStop(0,'rgba(255,255,255,.14)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.beginPath();c.ellipse(x,y,110,34,0,0,7);c.fill();}c.restore();}
    if(am.mist){c.save();const [y0,y1]=am.mist;for(let k=0;k<6;k++){const x=((T*(8+k*3)+k*170)%1100)-150,y=y0+(y1-y0)*h32(k,5,2);const g=c.createRadialGradient(x,y,4,x,y,90);g.addColorStop(0,'rgba(200,230,215,.14)');g.addColorStop(1,'rgba(200,230,215,0)');c.fillStyle=g;c.beginPath();c.ellipse(x,y,150,40,0,0,7);c.fill();}c.restore();}
    for(const [x0,y0,sid] of am.smoke||[]){if(sid&&!hsBuilt(p,sid))continue;for(let i=0;i<9;i++){const a=((T*.35+i/9)%1);const x=x0+Math.sin(a*4+i)*5+a*18,y=y0-a*60,r=3+a*13;c.fillStyle=`rgba(190,185,175,${(1-a)*.28})`;c.beginPath();c.arc(x,y,r,0,7);c.fill();}}
    for(const [x,y,w,h] of am.shimmer||[]){c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.strokeStyle='rgba(235,245,255,.3)';c.lineWidth=1.2;for(let i=0;i<8;i++){const yy=y+((T*60+i*h/8)%h);const xx=x+h32(i,1,4)*w;c.beginPath();c.moveTo(xx,yy);c.lineTo(xx+(w>40?10:0),yy+(w>40?0:10));c.stroke();}c.restore();}
    for(const [x,y,r,col] of am.glow||[]){const k=.55+.45*Math.sin(T*2+x);const g=c.createRadialGradient(x,y,1,x,y,r*(1+.15*k));g.addColorStop(0,col+'77');g.addColorStop(1,col+'00');c.globalCompositeOperation='lighter';c.fillStyle=g;c.fillRect(x-r*1.3,y-r*1.3,r*2.6,r*2.6);c.globalCompositeOperation='source-over';}
    for(const [x,y,w,h,fid] of am.fire||[]){if(fid&&!hsBuilt(p,fid))continue;for(let i=0;i<10;i++){const a=(T*.8+i/10)%1;const xx=x+h32(i,2,9)*w+Math.sin(T*3+i)*4,yy=y+h-a*h;c.fillStyle=`rgba(255,${180-a*100|0},80,${(1-a)*.6})`;c.fillRect(xx,yy,1.6,1.6);}}
    for(const [x0,y0,w] of am.embers||[]){for(let i=0;i<22;i++){const a=(T*.5+i/22)%1;const x=x0+h32(i,3,3)*w+Math.sin(T*2+i)*6,y=y0-a*90;c.fillStyle=`rgba(255,${150+60*h32(i,1,1)|0},60,${(1-a)*.9})`;c.fillRect(x,y,2,2);}}
    if(am.snow){c.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<55;i++){const x=(h32(i,1,5)*800+Math.sin(T+i)*14+T*8)%800,y=(h32(i,2,5)*374+T*(18+h32(i,3,5)*22))%374;c.fillRect(x,y,1.6,1.6);}}
    if(am.leaves){for(let i=0;i<12;i++){const x=(h32(i,1,8)*800+T*12+Math.sin(T*1.3+i)*20)%800,y=(h32(i,2,8)*374+T*(14+h32(i,4,8)*10))%374;c.save();c.translate(x,y);c.rotate(T*2+i);c.fillStyle=i%2?'rgba(200,170,60,.8)':'rgba(140,170,60,.8)';c.fillRect(-2,-1,4,2);c.restore();}}
    if(am.dust){c.fillStyle='rgba(230,200,150,.25)';for(let i=0;i<20;i++){const x=(h32(i,1,6)*800+T*25*(1+h32(i,2,6)))%800,y=250+h32(i,3,6)*110+Math.sin(T+i)*6;c.fillRect(x,y,2,1);}}
    const birds=am.birds||am.crows;if(birds){const [y0,n]=birds;c.strokeStyle=am.crows?'rgba(20,20,20,.8)':'rgba(40,30,20,.75)';c.lineWidth=1.3;for(let i=0;i<4;i++){const x=((T*(22+i*5)+i*260)%1000)-100,y=y0+Math.sin(T*.7+i)*n*.3+i*9,f=Math.sin(T*9+i)*3;c.beginPath();c.moveTo(x-5,y-f);c.lineTo(x,y);c.lineTo(x+5,y-f);c.stroke();}}
    if(am.bats){c.fillStyle='rgba(10,5,15,.85)';for(let i=0;i<5;i++){const x=((T*(30+i*7)+i*210)%950)-60,y=60+Math.sin(T*1.5+i*2)*30+i*14,f=Math.sin(T*14+i)*3;c.beginPath();c.moveTo(x-6,y-f);c.lineTo(x,y+2);c.lineTo(x+6,y-f);c.lineTo(x,y-1);c.fill();}}}
  const hi=TW.hover||TW.sel;if(hi&&hi!=='fort'){const cu=cutOf(fac,hi),built=hsBuilt(p,hi);
    if(cu){c.save();c.globalAlpha=built?.95:.85;c.drawImage(cu.gl,(cu.x-cu.P)/2,(cu.y-cu.P)/2,(cu.w+cu.P*2)/2,(cu.h+cu.P*2)/2);c.restore();
      if(!built){c.save();c.globalAlpha=.42+.08*Math.sin(now/260);c.drawImage(cu.cv,cu.x/2,cu.y/2,cu.w/2,cu.h/2);c.restore();}
      else{c.save();c.globalCompositeOperation='lighter';c.globalAlpha=.12+(red?0:.06*Math.sin(now/220));c.drawImage(cu.cv,cu.x/2,cu.y/2,cu.w/2,cu.h/2);c.restore();}}
    const pts=HSP[fac][hi];const bx0=cu?cu.x/2:Math.min(...pts.map(q=>q[0])),bw=cu?cu.w/2:60,by0=cu?cu.y/2:Math.min(...pts.map(q=>q[1]));
    const nm=hsName(hi)+(built?'':' — не построено');c.font='bold 15px Alegreya,Georgia,serif';const w=c.measureText(nm).width+16;const bx=clamp(bx0+bw/2-w/2,4,796-w),by=clamp(by0-26,4,340);
    c.fillStyle='rgba(20,12,4,.88)';c.fillRect(bx,by,w,22);c.strokeStyle='#b08a3a';c.lineWidth=1;c.strokeRect(bx+.5,by+.5,w-1,21);c.fillStyle=built?'#f3d27a':'#c8c0b0';c.textAlign='center';c.textBaseline='middle';c.fillText(nm,bx+w/2,by+11.5);}}
function hsAt(p,x,y){const D=panData(p.fac);if(D){const i=((Math.floor(y*2))*1600+Math.floor(x*2))*4;const lab=Math.round(D.m[i]/20)-1;if(lab>=0&&D.m[i+1]>60)return LBL[lab];}
  const H_S=HSP[p.fac];let best=null,ba=1e9;for(const id of LBL){const pts=H_S[id];if(!pts||!inPoly(x,y,pts))continue;let a=0;for(let i=0,j=pts.length-1;i<pts.length;j=i++)a+=(pts[j][0]+pts[i][0])*(pts[j][1]-pts[i][1]);a=Math.abs(a/2);if(a<ba){ba=a;best=id;}}return best;}
(function bindPan(){const cv=$('#pancv');
  cv.addEventListener('pointermove',e=>{if(!G||ui.scr!=='town'||e.pointerType!=='mouse')return;const p=CP();const [x,y]=lxy(e,cv);const id=hsAt(p,x,y);TW.hover=id;status(id?`<b>${hsName(id)}</b> — ${hsBuilt(p,id)?'нажмите, чтобы войти':'не построено: нажмите, чтобы построить'}`:'');});
  cv.addEventListener('pointerleave',()=>{TW.hover=null;});
  cv.addEventListener('pointerup',e=>{if(!G||mOpen)return;const p=CP();const [x,y]=lxy(e,cv);const id=hsAt(p,x,y);if(!id)return;TW.sel=id;status(`<b>${hsName(id)}</b>`);setTimeout(()=>{if(TW.sel===id)TW.sel=null;},1100);setTimeout(()=>openBuilding(p,id),e.pointerType==='mouse'?0:260);});})();
/* ---- HoMM3-style construction windows ---- */
function nextBld(p,lbl){if(lbl==='lib')return !p.b.lib1?'lib1':!p.b.lib2?'lib2':!p.b.lib3?'lib3':null;if(lbl==='car')return !p.b.car1?'car1':!p.b.car2?'car2':!p.b.car3?'car3':null;return p.b[lbl]?null:lbl;}
function bState(p,b){if(p.b[b.id])return 'built';const req=(b.r||[]).every(r=>p.b[r]);if(!req)return 'req';const c=bCost(p,b);if(p.cash<c.cash||p.kn<c.kn||p.conn<c.conn)return 'cash';if(p.bw===G.turn)return 'week';return 'ok';}
const BST={built:['#b08a3a','Построено'],ok:['#2e8a3a','Можно построить'],cash:['#9a2a20','Не хватает средств'],req:['#5a5a5a','Нужны другие здания'],week:['#8a6a1a','Уже строили на этой неделе']};
function costHTML(p,c){const it=(ic,v,have)=>v?`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px" class="${have>=v?'':'bad'}">${ico(ic)}<b>${ic==='gold'?fm(v):v}</b></span>`:'';return it('gold',c.cash,p.cash)+it('book',c.kn,p.kn)+it('seal',c.conn,p.conn)||'Бесплатно';}
function hallWindow(p){openM((box,close)=>{box.className='mbox wide';
  box.innerHTML=`<h2>Ратуша · ${FAC[p.fac].n}</h2><div class="mbody"><p class="small mute" style="text-align:center">${p.bw!==G.turn?'На этой неделе можно построить одно здание.':'На этой неделе уже строили — следующая постройка через неделю.'}</div>
   <div class="hallgrid">${BLD.map(b=>{const st=bState(p,b),[col,txt]=BST[st];return `<button class="hcard" data-bid="${b.id}" title="${txt}"><img src="${bldThumb(p.fac,bld2lbl(b.id),150,84)}" alt=""><span class="hn" style="background:${col}">${st==='built'?'✓ ':''}${b.n}</span></button>`;}).join('')}</div>
   <div class="small mute" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center">${Object.values(BST).map(([c,t])=>`<span><i style="display:inline-block;width:10px;height:10px;background:${c};margin-right:4px"></i>${t}</span>`).join('')}</div></div>
   <div class="mbtns"><button class="btn" id="hwc">${ico('no')} Закрыть</button></div>`;
  box.querySelector('#hwc').onclick=close;box.querySelectorAll('[data-bid]').forEach(b=>b.onclick=()=>{close();buildDialog(p,b.dataset.bid,true);});});}
function buildDialog(p,bid,fromHall){const b=BLDM[bid];if(!b)return;const st=bState(p,b),c=bCost(p,b),lbl=bld2lbl(bid);
  openM((box,close)=>{box.innerHTML=`<h2>${b.n}</h2><div class="mbody"><img src="${bldThumb(p.fac,lbl,320,170)}" alt="" style="display:block;width:100%;max-width:420px;margin:0 auto 8px;border:2px solid #b08a3a">
   <p>${b.d}${DWELL[bid]?' Жилища: '+DWELL[bid].map(k=>CRE[k].np).join(', ')+'.':''}</p>${(b.r||[]).length?`<p class="small">Требуется: ${b.r.map(r=>`<span class="${p.b[r]?'up':'bad'}">${BLDM[r].n}</span>`).join(', ')}</p>`:''}
   <div class="trade"><div class="small mute">Стоимость</div><div>${costHTML(p,c)}</div><div class="small" style="color:${BST[st][0]==='#2e8a3a'?'var(--good)':'var(--mute)'}">${BST[st][1]}</div></div></div>
   <div class="mbtns">${st==='built'?'':`<button class="btn pri" id="bdo" ${st==='ok'?'':'disabled'}>${ico('ok')} Построить</button>`}<button class="btn" id="bdc">${ico('no')} ${st==='built'?'Закрыть':'Отмена'}</button></div>`;
   box.querySelector('#bdc').onclick=()=>{close();if(fromHall)hallWindow(p);};const bd=box.querySelector('#bdo');if(bd)bd.onclick=()=>{doBuild(p,bid,close);sting('victory');};});}
/* ---- building windows ---- */
function buildBtn(p,bid){const b=BLDM[bid];if(!b)return '';if(p.b[bid])return `<p class="up">Построено.</p>`;const c=bCost(p,b),req=(b.r||[]).every(r=>p.b[r]),canB=p.bw!==G.turn,ok=p.cash>=c.cash&&p.kn>=c.kn&&p.conn>=c.conn&&req&&canB;
  return `<div class="trade"><div><b>${b.n}</b>: ${b.d}</div><div class="small">Стоимость: ${costStr(c)}${!req?` · <span class="bad">нужно: ${b.r.map(r=>BLDM[r].n).join(', ')}</span>`:''}${!canB?' · <span class="bad">на этой неделе уже строили</span>':''}</div><button class="btn ${ok?'pri':''}" data-build="${bid}" ${ok?'':'disabled'}>Построить</button></div>`;}
function doBuild(p,bid,close){const B_=BLDM[bid],c=bCost(p,B_),h=H(p);sfx('build');setTimeout(()=>sfx('gold'),260);p.cash-=c.cash;p.kn-=c.kn;p.conn-=c.conn;p.b[B_.id]=1;p.bw=G.turn;
  if(DWELL[B_.id])for(const k of DWELL[B_.id])p.avail[k]=(p.avail[k]||0)+CRE[k].g;toast(`Построено: ${B_.n}`);
  if(B_.id==='iis')lesson(p,'iis');if(B_.id==='guild')lesson(p,'fees');if(B_.id.startsWith('lib')&&nearCastle(p,h))learnSpells(p,h);if(close)close();afterAction();}
function bindBuild(box,p,close){box.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>doBuild(p,b.dataset.build,close));}
function recruitList(p,ks){return `<div class="recruit">${ks.map(k=>{const C=CRE[k],u=creUnit(k),av=p.avail[k]||0,s=SECM[C.sec];return `<div class="rc"><img src="${creImg(k)}" alt=""><div class="rc-m"><b>${C.n}</b><span class="mute">${s.name}: 1 = ${C.lot} ${s.kind==='bond'?'обл.':s.kind==='gold'?'г':'шт.'} · ${schedText(s)}</span>
   <span>Атака ${C.a} · Защита ${C.d} · Здоровье ${C.hp} · Урон ${C.mn}–${C.mx} · Скорость ${C.s}${C.ab?' · '+C.ab:''}</span><span><b class="gold">${fm(u)}</b> за 1 · доступно ${av}</span></div><button class="btn sm ${av&&p.cash>=u?'pri':''}" data-r="${k}" ${av&&p.cash>=u?'':'disabled'}>Нанять</button></div>`;}).join('')}</div>`;}
function openBuilding(p,id){if(id==='hall'){hallWindow(p);return;}if(id!=='fort'&&!hsBuilt(p,id)){const nb=nextBld(p,id);if(nb){buildDialog(p,nb);return;}}openM((box,close)=>{const built=hsBuilt(p,id);let body='';box.className='mbox wide';
  if(id==='hall'){body=`<p class="small mute">${FAC[p.fac].st}. ${FAC[p.fac].perk}</p><p class="small">${p.bw!==G.turn?'На этой неделе можно построить одно здание.':'<span class="bad">На этой неделе уже строили.</span>'}</p><div class="grid-b">`;
    for(const b of BLD){const isB=!!p.b[b.id],c=bCost(p,b),req=(b.r||[]).every(r=>p.b[r]),ok=p.cash>=c.cash&&p.kn>=c.kn&&p.conn>=c.conn&&req&&p.bw!==G.turn;
      body+=`<div class="bld ${isB?'built':''} ${!isB&&!req?'locked':''}"><div class="bn">${b.n}</div><div class="small mute">${b.d}</div>${isB?'<div class="ok">Построено</div>':`<button class="btn sm ${ok?'pri':''}" data-build="${b.id}" ${ok?'':'disabled'}>${costStr(c)}</button>${!req?`<div class="small mute">Нужно: ${b.r.map(r=>BLDM[r].n).join(', ')}</div>`:''}`}</div>`;}body+='</div>';}
  else if(id==='fort'){const dw=[];for(const b in DWELL)if(p.b[b])dw.push(...DWELL[b]);body=`<p class="small mute">Каждое существо — пакет ценных бумаг по рыночной цене. Прирост раз в неделю. Нанятые отряды встают в гарнизон.</p>`+(dw.length?recruitList(p,dw):'<div class="locked-box">Постройте «Брокерский счёт», чтобы нанимать первые отряды.</div>');}

/* ---- army strength & threat (HoMM3-style hover descriptions) ---- */
const stackPow=(D,n)=>n*D.hp*((D.mn+D.mx)/2)*(1+.05*(D.a+D.d));
const heroPow=h=>h.army.reduce((a,s)=>a+(s?stackPow(CRE[s.id],s.n):0),0)*(1+.05*(h.att+h.def));
const guardPow=g=>stackPow(NEU[g.mt],g.n);
function threat(h,g){const r=heroPow(h)/Math.max(1,guardPow(g));return r>2.5?['лёгкая добыча','up']:r>1.4?['скорее победа','up']:r>.8?['равный бой','gold']:r>.45?['опасно','bad']:['смертельно','bad'];}
/* ---- generator ---- */
function genMap(){const n=G.players.length,W=n>2?42:36,H_=n>2?36:32,N=W*H_,idx=(x,y)=>y*W+x,inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H_;
  const t=new Array(N).fill(0),I=4,cx=W>>1,cy=H_>>1;
  const C=[[I,I],[W-1-I,H_-1-I],[W-1-I,I],[I,H_-1-I]],M=[[cx,I],[cx,H_-1-I],[I,cy],[W-1-I,cy]];
  const zones=[];G.players.forEach((p,i)=>zones.push({type:'start',pid:i,s:C[i],th:FAC_THEME[p.fac],tier:1,c:i}));
  for(let i=n;i<4;i++)zones.push({type:'treasure',s:C[i],th:pick(['sand','swamp','autumn','dry','dirt']),tier:3,c:i});
  const midT=['grass','dirt','dry','autumn','sand','swamp'].sort(()=>Math.random()-.5);M.forEach((m,i)=>zones.push({type:'mid',s:m,th:midT[i],tier:2,m:i}));
  zones.push({type:'center',s:[cx,cy],th:pick(['dirt','sand','dry']),tier:4});const Z=zones.length,ZC=Z-1;
  const zt=new Int8Array(N);const sd=ri(1,999);
  for(let y=0;y<H_;y++)for(let x=0;x<W;x++){let b=0,bd=1e9;for(let k=0;k<Z;k++){const [sx,sy]=zones[k].s;const d=hdist(x,y,sx,sy)*(zones[k].type==='center'?1.25:1)+fbm(x/5,y/5,sd+k*17,64)*5;if(d<bd){bd=d;b=k;}}zt[idx(x,y)]=b;}
  // which zones connect: corner -> its two mids, mid -> centre
  const midOf={0:[0,2],1:[1,3],2:[0,3],3:[1,2]};const zc=k=>zones.findIndex(z=>z.c===k),zm=k=>zones.findIndex(z=>z.m===k);
  const links=[];for(let c=0;c<4;c++){const a=zc(c);if(a<0)continue;for(const m of midOf[c])links.push([a,zm(m)]);}for(let m=0;m<4;m++)links.push([zm(m),ZC]);
  // borders become ridges, except one passage per link
  const wall=new Uint8Array(N);for(let y=0;y<H_;y++)for(let x=0;x<W;x++){const i=idx(x,y);for(const [a,b] of hnb(x,y))if(inb(a,b)&&zt[idx(a,b)]!==zt[i]){wall[i]=1;break;}}
  const pass=[];for(const [A,B] of links){const [ax,ay]=zones[A].s,[bx,by]=zones[B].s,mx=(ax+bx)/2,my=(ay+by)/2;let best=null,bd=1e9;
    for(let y=1;y<H_-1;y++)for(let x=1;x<W-1;x++){if(zt[idx(x,y)]!==A)continue;for(const [a,b] of hnb(x,y)){if(!inb(a,b)||zt[idx(a,b)]!==B)continue;const d=Math.hypot(x-mx,(y-my)*1.2)+Math.random()*1.5;if(d<bd){bd=d;best=[x,y,a,b];}}}
    if(best){const [x,y,a,b]=best;wall[idx(x,y)]=0;wall[idx(a,b)]=0;pass.push({A,B,u:[x,y],v:[a,b]});}}
  for(let i=0;i<N;i++)if(wall[i]){const th=zones[zt[i]].th,x=i%W,y=(i/W)|0,r=fbm(x/3,y/3,sd+5,64);t[i]=th==='swamp'&&r<.42?2:(th==='snow'||th==='cave'?r<.6:r<.42)?3:1;}
  // interior features: lakes, groves, rocky outcrops
  for(let k=0;k<Z;k++){const cells=[];for(let i=0;i<N;i++)if(zt[i]===k&&!wall[i])cells.push(i);const nb=Math.round(cells.length/55);
    for(let j=0;j<nb;j++){let c=pick(cells),x=c%W,y=(c/W)|0;const [sx,sy]=zones[k].s;if(hdist(x,y,sx,sy)<3)continue;const ty=pick([1,1,3,2]),len=ri(3,7);
      for(let s=0;s<len;s++){const i=idx(x,y);if(zt[i]===k&&!wall[i])t[i]=ty;const nn=pick(hnb(x,y));if(inb(nn[0],nn[1])){x=nn[0];y=nn[1];}}}}
  for(const z of zones){const [sx,sy]=z.s;for(let y=sy-3;y<=sy+3;y++)for(let x=sx-3;x<=sx+3;x++)if(inb(x,y)&&hdist(sx,sy,x,y)<=2&&!wall[idx(x,y)])t[idx(x,y)]=0;}
  for(const ps of pass){t[idx(...ps.u)]=0;t[idx(...ps.v)]=0;}
  // roads through passages
  const pi=new Set(pass.flatMap(ps=>[idx(...ps.u),idx(...ps.v)]));
  const road=(sx,sy,tx,ty)=>{const S=idx(sx,sy),T=idx(tx,ty),cost=new Float64Array(N).fill(1e9),prev=new Int32Array(N).fill(-1);cost[S]=0;prev[S]=S;const Q=[[0,S]];
    while(Q.length){let bi=0;for(let q=1;q<Q.length;q++)if(Q[q][0]<Q[bi][0])bi=q;const [d,c]=Q.splice(bi,1)[0];if(c===T)break;if(d>cost[c])continue;const x=c%W,y=(c/W)|0;
      for(const [a,b] of hnb(x,y)){if(!inb(a,b))continue;const i=idx(a,b);if(wall[i]&&!pi.has(i))continue;const tt=t[i];const w=tt===4?.4:tt===0?1:tt===2?7:5;const nd=d+w+Math.random()*.25;if(nd<cost[i]){cost[i]=nd;prev[i]=c;Q.push([nd,i]);}}}
    let c=T,g=0;while(c!==S&&c>=0&&g++<2000){t[c]=4;c=prev[c];}t[S]=4;};
  for(const ps of pass){const A=zones[ps.A],B=zones[ps.B];road(A.s[0],A.s[1],ps.u[0],ps.u[1]);road(ps.v[0],ps.v[1],B.s[0],B.s[1]);t[idx(...ps.u)]=4;t[idx(...ps.v)]=4;}
  // ---- content ----
  const obj=[];let oid=1;const occ=new Set();
  const free=(k,near,rmin,rmax)=>{const [sx,sy]=near||zones[k].s;for(let tr=0;tr<900;tr++){const r=ri(rmin||0,rmax||12),a=Math.random()*6.283;const x=Math.round(sx+Math.cos(a)*r),y=Math.round(sy+Math.sin(a)*r*.85);
      if(!inb(x,y)||x<1||y<1||x>W-2||y>H_-2)continue;const i=idx(x,y);if(zt[i]!==k||wall[i]||(t[i]!==0&&t[i]!==4)||occ.has(i)||pi.has(i))continue;if(obj.some(o=>hdist(o.x,o.y,x,y)<=1))continue;occ.add(i);return [x,y];}return null;};
  const mts=Object.keys(NEU).filter(m=>m!=='infl');
  const add=(k,o,gz,near,rmin,rmax,mt)=>{const pos=free(k,near,rmin,rmax);if(!pos)return null;o.id=oid++;o.x=pos[0];o.y=pos[1];if(gz)o.g=guardFor(mt||pick(mts),gz);obj.push(o);return o;};
  const mine=(k,gz,near,rmin,rmax,own)=>{const m=pick(MINES);return add(k,{t:'mine',n:m.n,i:m.i,inc:m.inc,owner:own==null?-1:own},gz,near,rmin,rmax);};
  const lowC=CREK.filter(c=>CRE[c].t<=2),midC=CREK.filter(c=>CRE[c].t>=3&&CRE[c].t<=4),hiC=CREK.filter(c=>CRE[c].t>=5&&CRE[c].t<=6);
  const cluster=(k,items,gz)=>{const c=free(k,null,4,10);if(!c)return;occ.delete(idx(...c));for(const it of items)add(k,it,it.gz!=null?it.gz:gz,c,1,3);};
  const quest=()=>{const Q=pick(QUESTS);return {t:'seer',qk:Q.k,qn:pick(Q.n),rew:pick(['cash','kn','art','xp']),ra:pick(Object.keys(ARTS).filter(a=>a!=='crown'))};};
  const obIds=[];const mono=[];
  zones.forEach((z,k)=>{
    if(z.type==='start'){const p=G.players[z.pid],[sx,sy]=z.s;obj.push({id:oid++,t:'castle',x:sx,y:sy,pid:z.pid});occ.add(idx(sx,sy));
      const h=p.heroes[0];let hp=null;for(const [a,b] of hnb(sx,sy))if(inb(a,b)&&!wall[idx(a,b)]){hp=[a,b];break;}h.x=hp[0];h.y=hp[1];t[idx(h.x,h.y)]=t[idx(h.x,h.y)]===4?4:0;occ.add(idx(h.x,h.y));
      if(p.fac==='stronghold'){const m=MINES[0];add(k,{t:'mine',n:m.n,i:m.i,inc:m.inc,owner:z.pid},0,null,2,4);}
      mine(k,0,null,2,5);mine(k,1,null,5,9);cluster(k,[{t:'mill'},{t:'well'},{t:'pile',res:'cash',amt:ri(3,6)*1000}],0);
      add(k,{t:'dwell',k:pick(lowC),avail:0,owner:-1},1,null,4,9);add(k,{t:'stable'},0,null,4,10);add(k,{t:'tip',tip:ri(0,TIPS.length-1)},0,null,3,8);
      for(let j=0;j<2;j++)add(k,{t:'pile',res:pick(['kn','conn','cash']),amt:0},0,null,3,10);add(k,{t:'chest',amt:ri(6,12)*1000},0,null,4,10);
      for(let j=0;j<2;j++)add(k,{t:'mon'},1,null,4,11);}
    else if(z.type==='mid'){cluster(k,[{t:'shop',item:ri(0,SHOP.length-1)},{t:'trade'},{t:'well'}],0);mine(k,2);mine(k,2);
      const B=pick(BANKS.slice(0,2));const bo=add(k,{t:'bank',bk:BANKS.indexOf(B),lv:1},1,null,2,10,B.mt);if(bo)bo.g=guardFor(B.mt,2);
      for(let j=0;j<2;j++)add(k,{t:'chest',amt:ri(8,16)*1000},Math.random()<.5?1:0);add(k,{t:'pile',res:'kn',amt:ri(1,3)},0);add(k,{t:'pile',res:'cash',amt:ri(4,8)*1000},.0);
      add(k,{t:pick(['arena','shrine','tree'])},0);add(k,quest(),0);const ob=add(k,{t:'obelisk'},0);if(ob)obIds.push(ob.id);add(k,{t:'dwell',k:pick(midC),avail:0,owner:-1},2);
      add(k,{t:'tip',tip:ri(0,TIPS.length-1)},0);add(k,{t:'camp'},Math.random()<.5?2:0);add(k,{t:'idol'},0);add(k,{t:'fount'},0);
      const mo=add(k,{t:'mono',m:z.m},0);if(mo)mono.push(mo);for(let j=0;j<3;j++)add(k,{t:'mon'},2);
      if(Math.random()<.5){const sk=Object.keys(SK);add(k,{t:'sage',sk:pick(sk)},1);}
      if(Math.random()<.6)add(k,{t:'art',a:pick(Object.keys(ARTS).filter(a=>a!=='crown'))},2);}
    else if(z.type==='treasure'){mine(k,3);mine(k,3);mine(k,2);const B1=BANKS[2],B2=pick([BANKS[1],BANKS[3]]);add(k,{t:'bank',bk:2,lv:2},3,null,2,10,B1.mt);add(k,{t:'bank',bk:BANKS.indexOf(B2),lv:2},3,null,2,10,B2.mt);
      for(let j=0;j<2;j++)add(k,{t:'art',a:pick(Object.keys(ARTS).filter(a=>a!=='crown'))},3);add(k,{t:'univ',sks:Object.keys(SK).sort(()=>Math.random()-.5).slice(0,3)},0);add(k,{t:'obs'},0);
      add(k,{t:'prison',lvl:ri(3,5)},3);for(let j=0;j<2;j++)add(k,{t:'chest',amt:ri(12,20)*1000},2);add(k,{t:'shrine'},0);add(k,{t:'dwell',k:pick(hiC),avail:0,owner:-1},3);
      const ob=add(k,{t:'obelisk'},0);if(ob)obIds.push(ob.id);for(let j=0;j<3;j++)add(k,{t:'mon'},3);add(k,quest(),0);}
    else{const [sx,sy]=z.s;obj.push({id:oid++,t:'treas',x:sx,y:sy,g:guardFor('infl',4)});occ.add(idx(sx,sy));add(k,{t:'bank',bk:2,lv:3},4,null,3,9,'crisis');
      for(let j=0;j<2;j++)add(k,{t:'art',a:pick(Object.keys(ARTS).filter(a=>a!=='crown'))},3);const py=free(k,null,3,8);if(py)obj.push({id:oid++,t:'pyr',x:py[0],y:py[1]});
      const ob=add(k,{t:'obelisk'},0);if(ob)obIds.push(ob.id);mine(k,3);add(k,{t:'univ',sks:Object.keys(SK).sort(()=>Math.random()-.5).slice(0,3)},0);for(let j=0;j<2;j++)add(k,{t:'mon'},3);}});
  // guards on passages: monsters or Central Bank quiz gates
  for(const ps of pass){const A=zones[ps.A],B=zones[ps.B],tier=Math.max(A.tier,B.tier),h=A.tier>=B.tier?ps.u:ps.v;const i=idx(...h);
    if(A.type!=='start'&&B.type!=='start'&&Math.random()<.4){obj.push({id:oid++,t:'gate',x:h[0],y:h[1],qz:ri(0,QUIZ.length-1)});}
    else obj.push({id:oid++,t:'mon',x:h[0],y:h[1],g:guardFor(pick(mts),Math.min(4,tier)),border:1});occ.add(i);}

  for(const o of obj){if(o.t==='pile'&&!o.amt)o.amt=o.res==='kn'?ri(1,3):o.res==='conn'?1:ri(3,8)*1000;}
  // grail hidden in the centre

  const reach=()=>{const seen=new Uint8Array(N);const [sx,sy]=zones[0].s;const q=[idx(sx,sy)];seen[q[0]]=1;while(q.length){const c=q.pop(),x=c%W,y=(c/W)|0;for(const [a,b] of hnb(x,y)){if(!inb(a,b))continue;const i=idx(a,b);if(!seen[i]&&passable(i)){seen[i]=1;q.push(i);}}}return seen;};
  let seen=reach();const pts=obj.map(o=>[o.x,o.y]).concat(G.players.map(p=>[p.heroes[0].x,p.heroes[0].y]));
  for(const [ox,oy] of pts){if(seen[idx(ox,oy)])continue;const k=zt[idx(ox,oy)],[sx,sy]=zones[k].s;let x=ox,y=oy,g=0;
    while(!seen[idx(x,y)]&&g++<300){const i=idx(x,y);if(!passable(i))t[i]=0;const nb=hnb(x,y).filter(([a,b])=>inb(a,b)&&(zt[idx(a,b)]===k||seen[idx(a,b)]));nb.sort((a,b)=>hdist(a[0],a[1],sx,sy)-hdist(b[0],b[1],sx,sy));const nx=Math.random()<.85?nb[0]:pick(nb);if(!nx)break;[x,y]=nx;}seen=reach();}
  for(const o of obj)if(!passable(idx(o.x,o.y)))t[idx(o.x,o.y)]=0;

  G.players.forEach((p,i)=>{p.ex=new Array(N).fill(0);const z=zones.find(z=>z.pid===i);reveal(p,z.s[0],z.s[1],6);reveal(p,p.heroes[0].x,p.heroes[0].y,5);});}

function bankVisit(p,h,o){if(o.empty){toast('Здесь уже пусто.');return;}const c=bankLoot(o)*rnd(.8,1.25);p.cash+=c;p.kn+=o.lv;let ex='';if(Math.random()<.3*o.lv){const a=pick(Object.keys(ARTS).filter(a=>a!=='crown'&&!h.arts.includes(a)));if(a){h.arts.push(a);ex=` и артефакт «${ARTS[a].n}»`;}}o.empty=true;sfx('gold');
  msg(BANKS[o.bk].n,`<p>Охрана повержена. Добыча: ${fm(c)}, +${o.lv} Знаний${ex}.</p><p class="joke">Высокая доходность почти всегда оплачена высоким риском. Сегодня риск окупился.</p>`);}
function dwellVisit(p,h,o){if(o.owner!==p.id){o.owner=p.id;sfx('gold');}const C=CRE[o.k],u=creUnit(o.k);openM((box,close)=>{const mx=Math.max(0,Math.min(o.avail,Math.floor(p.cash/u)));

  ${!canAdd(h.army,o.k)?'<p class="bad">В армии героя нет места.</p>':''}<div class="trade"><label for="dq">Нанять: <b id="dqv">${mx}</b></label><input type="range" id="dq" min="0" max="${mx}" value="${mx}"></div></div><div class="mbtns"><button class="btn" id="dc">Закрыть</button><button class="btn pri" id="dh" ${mx&&canAdd(h.army,o.k)?'':'disabled'}>Нанять</button></div>`;
  const q=box.querySelector('#dq');q.oninput=()=>box.querySelector('#dqv').textContent=q.value;box.querySelector('#dc').onclick=()=>{close();afterAction();};
  box.querySelector('#dh').onclick=()=>{const n=+q.value;if(n>0&&buySec(p,C.sec,n*C.lot,false)){addCre(h.army,o.k,n);o.avail-=n;sfx('gold');toast(`Нанято: ${C.np} ×${n}`);}close();afterAction();};});}
function gateQuiz(p,h,o){p.gates=p.gates||{};if(p.gates[o.id]){toast('Шлагбаум для вас открыт — проходите.');return;}if(p.vis['g'+o.id]===G.turn){toast('Повторная попытка — на следующей неделе.');return;}const Q=QUIZ[o.qz];
  openM((box,close)=>{box.innerHTML=`<h2>Шлагбаум ЦБ</h2><div class="mbody"><p class="small mute">Строгий инспектор: «Пропускаем только финансово грамотных».</p><p><b>${Q.q}</b></p>${Q.a.map((a,i)=>`<button class="act" data-qa="${i}">${a}</button>`).join('')}</div>`;
    box.querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.qa===Q.c;close();if(ok){p.gates[o.id]=1;p.kn++;sfx('heal');msg('Верно!',`<p>${Q.e}</p><p>Шлагбаум поднят, +1 Знание.</p>`);}else{p.vis['g'+o.id]=G.turn;sfx('miss');msg('Неверно',`<p>Правильный ответ: «${Q.a[Q.c]}». ${Q.e}</p><p class="small mute">Попробовать снова можно на следующей неделе — вопрос будет другим.</p>`);o.qz=(o.qz+1+ri(0,3))%QUIZ.length;}afterAction();});});}
function seerVisit(p,h,o){p.q=p.q||{};if(p.q[o.id]){toast('Провидец уже наградил вас.');return;}const Q=QUESTS.find(q=>q.k===o.qk);const rewT={cash:`${fm(60000*G.cpi)}`,kn:'+4 Знания',art:`артефакт «${ARTS[o.ra].n}»`,xp:'+1500 опыта'}[o.rew];
  if(Q.ok(p,o.qn,h)){Q.pay(p,o.qn);p.q[o.id]=1;if(o.rew==='cash')p.cash+=60000*G.cpi;else if(o.rew==='kn')p.kn+=4;else if(o.rew==='art')h.arts.push(o.ra);else gainXP(p,h,1500);sfx('heal');msg('Хижина провидца',`<p>«Ты справился. Держи награду: ${rewT}».</p>`);afterAction();}
  else msg('Хижина провидца',`<p>«${Q.t(o.qn)}»</p><p class="small">Награда: <b>${rewT}</b>.</p>`);}
function grailHint(p,fresh){const N=G.map.obN||1,k=Math.min(p.obel||0,N),g=G.map.grail;if(!g){toast('Обелиск молчит.');return;}const r=Math.max(0,Math.round(8*(1-k/N)));
  msg('Обелиск',`<p>${fresh?'Вы разбираете древние письмена. ':''}Прочитано обелисков: ${k} из ${N}.</p><p>${r===0?'<b>Место Грааля известно точно</b> — оно отмечено на мини-карте. Встаньте туда и выберите «Копать» в опциях приключений.':`Грааль «Формула сложного процента» спрятан в центре карты, в радиусе ~${r} клеток от отметки на мини-карте.`}</p><p class="joke">Найденный Грааль навсегда даёт +3% к ставке накопительного счёта и +20 Хладнокровия.</p>`);}
function digGrail(){const p=CP(),h=H(p);if(h.mp>0&&h.mp<speed(h)-1e-6){toast('Копать можно только в начале дня, пока герой не двигался.');return;}if(h.mp<=0){if(h.ap<=0){toast('Дни этой недели закончились.');return;}h.ap--;}h.mp=0;const g=G.map.grail;
  if(g&&h.x===g[0]&&h.y===g[1]&&!G.map.grailFound){G.map.grailFound=p.id;p.grail=true;p.calm=Math.min(calmMax(p),p.calm+20);sfx('victory');msg('Грааль найден!',`<p>Под ногами — сундук со свитком «Формула сложного процента: A = P·(1+r)ⁿ».</p><p>Навсегда: +3% к ставке накопительного счёта, +20 Хладнокровия.</p><p class="joke">Главный секрет богатства оказался формулой из школьного учебника. Просто её мало кто применяет.</p>`);lesson(p,'compound');}
  else{sfx('miss');toast('Здесь ничего нет. Потрачен день.');}afterAction();}

function campBuild(sc,im){const ps=sc.ps,IW=im.width,IH=im.height,W=Math.floor((IW/ps-18)/54),H_=Math.floor((IH/ps-36)/72),t=new Array(W*H_).fill(0),idx=(x,y)=>y*W+x;

  const dSeg=(px,py,a,b)=>{const [ax,ay]=a,[bx,by]=b,dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy||1;let u=((px-ax)*dx+(py-ay)*dy)/L;u=clamp(u,0,1);return Math.hypot(px-ax-u*dx,py-ay-u*dy);};
  for(let y=0;y<H_;y++)for(let x=0;x<W;x++){const px=hcx(x)*ps,py=hcy(x,y)*ps;if(sc.block.some(pl=>inP(px,py,pl))){t[idx(x,y)]=3;continue;}
    for(const ln of sc.rivers){const L=ln.map(tx);for(let i=0;i<L.length-1;i++)if(dSeg(px,py,L[i],L[i+1])<sc.rw){t[idx(x,y)]=2;break;}}}
  const toHex=pt=>{const [px,py]=tx(pt);const [c,r]=pix2hex(px/ps,py/ps);return [clamp(c,0,W-1),clamp(r,0,H_-1)];};
  const obj=[];let oid=1;const used=new Set();
  const place=(pt)=>{let [x,y]=toHex(pt);if(used.has(idx(x,y))){for(const [a,b] of hnb(x,y))if(a>=0&&b>=0&&a<W&&b<H_&&!used.has(idx(a,b))){x=a;y=b;break;}}used.add(idx(x,y));t[idx(x,y)]=0;return [x,y];};
  const [cx,cy]=place(sc.castle);obj.push({id:oid++,t:'castle',x:cx,y:cy,pid:0});
  for(const d of sc.objs){const [x,y]=place(d.at);const o={id:oid++,t:d.t,x,y};
    if(d.t==='mine'){const m=MINES.find(q=>q.n===d.n)||MINES[0];Object.assign(o,{n:m.n,i:m.i,inc:m.inc,owner:-1});}
    if(d.t==='mon'&&!d.g)o.g=guardFor('fees',1);
    if(d.g)o.g=guardFor(d.g[0],d.g[1]);
    for(const k of ['painted','tag','name','hint','sk','item','tip','res','amt','a'])if(d[k]!=null)o[k]=d[k];
    if(d.t==='chest')o.amt=o.amt||ri(8,16)*1000;if(d.t==='sage'&&!o.sk)o.sk=pick(Object.keys(SK));if(d.t==='shop'&&o.item==null)o.item=ri(0,SHOP.length-1);if(d.t==='tip'&&o.tip==null)o.tip=ri(0,TIPS.length-1);
    obj.push(o);}
  // carve walkable connections from castle to every object
  const pass=i=>t[i]===0||t[i]===4;const reach=()=>{const seen=new Uint8Array(W*H_);const q=[idx(cx,cy)];seen[q[0]]=1;while(q.length){const c=q.pop(),x=c%W,y=(c/W)|0;for(const [a,b] of hnb(x,y)){if(a<0||b<0||a>=W||b>=H_)continue;const ni=idx(a,b);if(!seen[ni]&&pass(ni)){seen[ni]=1;q.push(ni);}}}return seen;};
  let seen=reach();for(const o of obj){if(seen[idx(o.x,o.y)])continue;let x=o.x,y=o.y,g=0;while(!seen[idx(x,y)]&&g++<200){if(t[idx(x,y)]!==0)t[idx(x,y)]=4;const nb=hnb(x,y).filter(([a,b])=>a>=0&&b>=0&&a<W&&b<H_);nb.sort((a,b)=>hdist(a[0],a[1],cx,cy)-hdist(b[0],b[1],cx,cy));[x,y]=nb[0];}seen=reach();}
  for(let i=0;i<t.length;i++)if(t[i]===4)t[i]=0;

const CAMP_REF={grass:[86,120,52],autumn:[140,110,50],dry:[160,140,90],snow:[215,220,228],sand:[205,180,120],swamp:[70,80,50],dirt:[115,95,70]};
function campFlatten(im){if(!G||!G.camp||G.camp.flat||!im)return;const m=G.map,{W,H,t}=m,ps=G.camp.ps,N=W*H;G.camp.IW=im.width;
  const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;const c=cv.getContext('2d');c.drawImage(im,0,0);const D=c.getImageData(0,0,im.width,im.height).data;
  const sample=(x,y)=>{let r=0,g=0,b=0,n=0;const X=Math.round(hcx(x)*ps),Y=Math.round(hcy(x,y)*ps);for(let dy=-10;dy<=10;dy+=5)for(let dx=-10;dx<=10;dx+=5){const xx=clamp(X+dx,0,im.width-1),yy=clamp(Y+dy,0,im.height-1),k=(yy*im.width+xx)*4;r+=D[k];g+=D[k+1];b+=D[k+2];n++;}return [r/n,g/n,b/n];};
  let th=new Array(N),col=new Array(N);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)col[y*W+x]=sample(x,y);
  const winter=G.camp.id==='c3';const lums=col.map(q=>(q[0]+q[1]+q[2])/3).sort((a,b)=>a-b),kk=clamp(118/Math.max(20,lums[lums.length>>1]),1,2.4);
  for(let i=0;i<N;i++){const [r,g,b]=col[i].map(v=>Math.min(255,v*kk)),[h,s,v]=rgb2hsv(r,g,b);let k;
    if(s<.2)k=v>(winter?.36:.62)?'snow':v<.3?'cave':'dirt';else if(h>=.17&&h<.45)k=v<.32?'swamp':'grass';else if(h>=.1&&h<.17)k=v>.66&&s<.55?'sand':s>.55?'grass':'dry';else if(h<.1||h>.94)k=s>.5?'autumn':'dirt';else k=v>.6?'snow':'dirt';th[i]=k;}
  for(let pass=0;pass<3;pass++){const n2=th.slice();for(let y=0;y<H;y++)for(let x=0;x<W;x++){const cnt={};cnt[th[y*W+x]]=1.5;for(const [a,b] of hnb(x,y))if(a>=0&&b>=0&&a<W&&b<H){const k=th[b*W+a];cnt[k]=(cnt[k]||0)+1;}n2[y*W+x]=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];}th=n2;}
  // the painting tells us where forests and rocks are
  const keep=new Set(m.obj.map(o=>o.y*W+o.x));for(const q of G.players)for(const h of q.heroes)keep.add(h.y*W+h.x);
  const near=(i)=>{const x=i%W,y=(i/W)|0;return m.obj.some(o=>hdist(o.x,o.y,x,y)<=1)||G.players.some(q=>q.heroes.some(h=>hdist(h.x,h.y,x,y)<=1));};
  for(let i=0;i<N;i++){const [r,g,b]=col[i],lum=(r+g+b)/3,green=g>r*1.04&&g>b*1.08;
    if(t[i]===3&&green&&lum<115)t[i]=1;else if(t[i]===0&&!keep.has(i)&&!near(i)&&green&&lum<64)t[i]=1;}
  // everything must stay reachable from the castle (monsters count as passable)
  const castle=m.obj.find(o=>o.t==='castle');const S=castle.y*W+castle.x,passable=i=>t[i]===0||t[i]===4;
  const reach=()=>{const s=new Uint8Array(N);const q=[S];s[S]=1;while(q.length){const cc=q.pop(),x=cc%W,y=(cc/W)|0;for(const [a,b] of hnb(x,y)){if(a<0||b<0||a>=W||b>=H)continue;const i=b*W+a;if(!s[i]&&(passable(i)||keep.has(i))){s[i]=1;q.push(i);}}}return s;};
  let seen=reach();const carve=from=>{const cost=new Float64Array(N).fill(1e9),prev=new Int32Array(N).fill(-1);cost[from]=0;const Q=[[0,from]];let hit=-1;
    while(Q.length){let bi=0;for(let k=1;k<Q.length;k++)if(Q[k][0]<Q[bi][0])bi=k;const [d,cc]=Q.splice(bi,1)[0];if(seen[cc]){hit=cc;break;}if(d>cost[cc])continue;const x=cc%W,y=(cc/W)|0;
      for(const [a,b] of hnb(x,y)){if(a<0||b<0||a>=W||b>=H)continue;const i=b*W+a;const w=passable(i)?1:t[i]===1?3:t[i]===3?6:25;if(d+w<cost[i]){cost[i]=d+w;prev[i]=cc;Q.push([d+w,i]);}}}
    if(hit<0)return;let cc=prev[hit],g=0;while(cc>=0&&cc!==from&&g++<400){if(!passable(cc))t[cc]=0;cc=prev[cc];}};
  for(const i of keep){if(!seen[i]){if(!passable(i)&&!m.obj.some(o=>o.y*W+o.x===i))t[i]=0;carve(i);seen=reach();}}
  for(const o of m.obj)o.painted=0;m.th=th;G.camp.flat=1;MP.map=null;}

      ${pls.slice(0,n).map((pl,i)=>`<div class="trade"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"><select id="pa${i}" aria-label="Кто играет" ${i===0?'disabled':''}><option value="hu" ${pl.ai&&i?'':'selected'}>Человек</option><option value="ai" ${pl.ai&&i?'selected':''}>Компьютер</option></select><input type="text" id="pn${i}" value="${esc(pl.name)}" maxlength="16" aria-label="Имя игрока ${i+1}"><select id="pf${i}" aria-label="Фракция игрока ${i+1}">${Object.keys(FAC).map(k=>`<option value="${k}" ${k===pl.fac?'selected':''}>${FAC[k].n}</option>`).join('')}</select></div>
        <div class="small"><b>${FAC[pl.fac].st}.</b> ${FAC[pl.fac].perk} <span class="bad">Слабость:</span> <span class="mute">${FAC[pl.fac].weak}</span></div></div>`).join('')}
      <div class="lbl">Карта</div><select id="ngTpl" aria-label="Шаблон карты"><option value="random" ${tpl==='random'?'selected':''}>Случайный шаблон</option><optgroup label="Генератор по шаблону">${Object.entries(TPLS).map(([k,T])=>`<option value="${k}" ${k===tpl?'selected':''} ${n<T.pl[0]||n>T.pl[1]?'disabled':''}>${T.n} · ${T.pl[0]===T.pl[1]?T.pl[0]:T.pl[0]+'–'+T.pl[1]} игр.</option>`).join('')}</optgroup><optgroup label="Авторские карты">${Object.entries(AMAPS).map(([k,T])=>`<option value="a:${k}" ${'a:'+k===tpl?'selected':''} ${n>T.pl[1]?'disabled':''}>${T.n} · до ${T.pl[1]} игр.</option>`).join('')}</optgroup></select><div class="small mute" style="margin:4px 0 2px">${tpl==='random'?'Генератор сам выберет один из шаблонов под число игроков.':tpl.startsWith('a:')?AMAPS[tpl.slice(2)].d:TPLS[tpl].d}</div>
      <div class="lbl">Сценарий</div><div class="seg">${[[1,'Первый год'],[5,'Пятилетка'],[15,'Путь к свободе · 15 лет']].map(([k,t])=>`<button class="${k===years?'on':''}" data-y="${k}">${t}</button>`).join('')}</div>
      <div class="lbl">Победа</div><div class="seg"><button class="${mode==='capital'?'on':''}" data-m="capital">Больше реальный капитал</button><button class="${mode==='race'?'on':''}" data-m="race">Первым к свободе</button></div></div>
      <div class="mbtns"><button class="btn" id="ng0">Отмена</button><button class="btn pri big" id="ng1">Начать игру</button></div>`;
      box.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{grab();n=+b.dataset.n;draw();});box.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{grab();years=+b.dataset.y;draw();});
      box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{grab();mode=b.dataset.m;draw();});box.querySelectorAll('select').forEach(e=>e.onchange=()=>{grab();const s=box.querySelector('#ngTpl');if(s)tpl=s.value;draw();});
      box.querySelector('#ng0').onclick=close;box.querySelector('#ng1').onclick=()=>{grab();close();{const s=box.querySelector('#ngTpl');if(s)tpl=s.value;}MAP_TPL=(TPLS[tpl]&&(n<TPLS[tpl].pl[0]||n>TPLS[tpl].pl[1]))||(tpl.startsWith('a:')&&n>AMAPS[tpl.slice(2)].pl[1])?'random':tpl;newGame({players:pls.slice(0,n),years,mode});G.players.forEach((q,i)=>{q.ai=!!(i&&pls[i].ai);});G.camp=null;save();enter(true);};};draw();});}
function enter(fresh){MP.map=null;show('adv');ui.tab='map';const p=CP();requestAnimationFrame(()=>{const h=H(p);centerOn(h.x,h.y);renderAll();if(fresh||p.rep.length||G.turn===0)startTurnUI(p);});}

initTex();initIcons();fitStage();addEventListener('resize',fitStage);addEventListener('orientationchange',()=>setTimeout(fitStage,250));
(async()=>{try{await loadCore(f=>{const b=$('#ldbar');if(b)b.style.width=Math.round(f*100)+'%';});}catch(e){}
  if(!A.ok){$('#lds').textContent='Не удалось загрузить графику. Проверьте соединение и обновите страницу.';return;}
  applyCanvaIcons();$('#loader').hidden=true;showStart();})();
</script>
